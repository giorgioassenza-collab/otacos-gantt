<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Sync check</title></head>
<body style="font:14px system-ui;padding:24px">
<h1>Sync check</h1>
<p>Shows how often the shared board is being written. Requires being logged in to the workspace in this browser.</p>
<pre id="out">Starting…</pre>
<script>
(async () => {
  const out = document.getElementById("out");
  const db = await new Promise((res, rej) => { const r = indexedDB.open("firebaseLocalStorageDb"); r.onsuccess = () => res(r.result); r.onerror = rej; });
  const rows = await new Promise((res) => { const tx = db.transaction("firebaseLocalStorage"); const q = tx.objectStore("firebaseLocalStorage").getAll(); q.onsuccess = () => res(q.result); });
  const token = rows.map((r) => r.value).find((v) => v && v.stsTokenManager)?.stsTokenManager?.accessToken;
  if (!token) { out.textContent = "Not logged in."; return; }
  const url = "https://firestore.googleapis.com/v1/projects/o-tacos-gantt/databases/(default)/documents/boards/default?mask.fieldPaths=revision";
  const seen = [];
  window.otSyncCheck = seen;
  for (let i = 0; i < 20; i++) {
    const r = await fetch(url, { headers: { Authorization: "Bearer " + token } });
    const j = await r.json();
    seen.push(j.updateTime || ("HTTP " + r.status));
    out.textContent = seen.join("\n");
    await new Promise((res) => setTimeout(res, 3000));
  }
  out.textContent += "\nDone.";
})();
</script>
</body>
</html>
