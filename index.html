          </div>
          <div class="modal-actions">
            <button class="text-btn" type="button" data-export-data>Esporta</button>
            <button class="text-btn" type="button" data-import-data>Importa</button>
          </div>
        </div>
        <div class="settings-title"><h3>Ultime modifiche</h3></div>
        ${historyHtml}
        <div class="settings-title"><h3>Backup automatici</h3></div>
        ${backupHtml || `<div class="history-row"><div><strong>Nessun backup ancora</strong><span>Il prossimo salvataggio ne creera uno.</span></div></div>`}
        <div class="settings-title"><h3>Versioni salvate nel browser</h3></div>
        ${storedHtml || `<div class="history-row"><div><strong>Nessuna versione trovata</strong><span>Non ci sono altri archivi locali disponibili.</span></div></div>`}
      `;
    }

    function restoreHistory(index, options = {}) {
      const entry = history[index];
      if (!entry) return;
      const current = cloneData(data);
      data = cloneData(entry.snapshot);
      history.splice(index, 1);
      if (options.keepCurrent !== false && dataSignature(current) !== dataSignature(data)) {
        history.unshift({
          id: `hist-${Date.now()}-${Math.random().toString(16).slice(2)}`,
          label: "Prima del ripristino",
          time: Date.now(),
          snapshot: current
        });
      }
      history = history.slice(0, 10);
      saveBackup("Ripristino cronologia", data);
      lastSavedData = cloneData(data);
      saveHistory();
      queueRemoteSave("Ripristino cronologia");
      render();
    }

    function restoreSnapshot(snapshot, label = "Ripristino backup") {
      if (!snapshot || !Array.isArray(snapshot.tasks)) return;
      saveBackup("Prima del ripristino", data);
      data = normalizeData(cloneData(snapshot));
      saveBackup(label, data);
      saveData(label);
      render();
    }

    function exportData() {
      const payload = {
        app: "noku-gantt",
        exportedAt: new Date().toISOString(),
        version: window.NOKU_APP_VERSION || "v98",
        data: normalizeData(cloneData(data)),
        history: history.slice(0, 10),
        backups: loadBackups().slice(0, 20)
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `noku-gantt-backup-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function importDataFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.addEventListener("load", () => {
        try {
          const parsed = JSON.parse(String(reader.result || "{}"));
          const imported = parsed.data && Array.isArray(parsed.data.tasks) ? parsed.data : parsed;
          if (!imported || !Array.isArray(imported.tasks)) {
            window.alert("Il file non sembra un backup valido di NOku Gantt.");
            return;
          }
          restoreSnapshot(imported, "Import backup JSON");
          if (Array.isArray(parsed.history)) {
            history = parsed.history.filter((entry) => entry?.snapshot).slice(0, 10);
            saveHistory();
          }
          if (Array.isArray(parsed.backups)) {
            safeStorageSet(backupKey, JSON.stringify(parsed.backups.filter((entry) => entry?.snapshot).slice(0, 20)));
          }
          render();
        } catch (error) {
          console.error(error);
          window.alert("Non riesco a leggere questo backup JSON.");
        }
      });
      reader.readAsText(file);
    }

    function undoLastChange() {
      restoreHistory(0, { keepCurrent: false });
    }

    function stripTime(date) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate());
    }

    function parseDate(value) {
      const [year, month, day] = value.split("-").map(Number);
      return new Date(year, month - 1, day);
    }

    function iso(date) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    }

    function addDays(date, amount) {
      const next = new Date(date);
      next.setDate(next.getDate() + amount);
      return next;
    }

    function diffDays(a, b) {
      return Math.round((stripTime(a) - stripTime(b)) / DAY_MS);
    }

    function daysBetween(start, end) {
      return Math.max(1, diffDays(end, start) + 1);
    }

    function dayWidth() {
      return Number(getComputedStyle(document.documentElement).getPropertyValue("--day").replace("px", ""));
    }

    function clampZoom(value) {
      if (!Number.isFinite(value)) return 1;
      return Math.max(.25, Math.min(3, value));
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function sidebarWidth() {
      return document.querySelector(".sidebar")?.getBoundingClientRect().width || 0;
    }

    function rowHeight() {
      return Number(getComputedStyle(document.documentElement).getPropertyValue("--row").replace("px", ""));
    }

    function laneStep() {
      if (isUltraOverview() || isCompactOverview()) {
        const maxHeight = visibleTimelineItems().reduce((max, task) => Math.max(max, compactBarHeight(task, estimatedBarWidth(task))), 0);
        return maxHeight + 10;
      }
      return 32;
    }

    function estimateWrappedLines(text, contentWidth, fontSize) {
      const maxWidth = Math.max(36, contentWidth);
      const words = String(text || "").trim().split(/\s+/).filter(Boolean);
      if (!words.length) return 1;
      const canvas = estimateWrappedLines.canvas || (estimateWrappedLines.canvas = document.createElement("canvas"));
      const context = canvas.getContext("2d");
      const fallbackCharWidth = fontSize * .64;
      const textWidth = (value) => {
        if (!context) return String(value || "").length * fallbackCharWidth;
        context.font = `900 ${fontSize}px "Arial Narrow", "Helvetica Neue", Arial, sans-serif`;
        return context.measureText(String(value || "")).width;
      };
      const spaceWidth = textWidth(" ");
      let lines = 1;
      let lineWidth = 0;
      words.forEach((word) => {
        const wordWidth = Math.max(fallbackCharWidth, textWidth(word));
        if (wordWidth > maxWidth) {
          const chunkLines = Math.ceil(wordWidth / maxWidth);
          if (lineWidth > 0) {
            lines += chunkLines;
            lineWidth = wordWidth % maxWidth;
          } else {
            lines += chunkLines - 1;
            lineWidth = wordWidth % maxWidth;
          }
          return;
        }
        const nextWidth = lineWidth ? lineWidth + spaceWidth + wordWidth : wordWidth;
        if (nextWidth > maxWidth) {
          lines += 1;
          lineWidth = wordWidth;
        } else {
          lineWidth = nextWidth;
        }
      });
      return lines;
    }

    function estimatedBarWidth(task) {
      const span = daysBetween(parseDate(task.start), parseDate(task.end || task.start));
      if (task.type === "subtask") return Math.max(92, span * dayWidth() - 24);
      if (task.type === "ooo") return Math.max(74, span * dayWidth() - 16);
      return Math.max(44, span * dayWidth() - 16);
    }

    function compactBarHeight(task, barWidth = estimatedBarWidth(task)) {
      if (!isCompactOverview()) return task?.type === "subtask" ? 28 : 26;
      if (task?.type === "ooo") return isUltraOverview() ? 34 : 30;
      const fontSize = isUltraOverview() ? 10 : 11;
      const lineHeight = fontSize * (isUltraOverview() ? 1.1 : 1.12);
      const horizontalPadding = isUltraOverview() ? 12 : 16;
      const titleWidth = Math.max(36, barWidth - horizontalPadding);
      const titleLines = estimateWrappedLines(task?.name || "Task", titleWidth, fontSize);
      const controlsHeight = compactControlsHeight(task, titleWidth);
      const padding = 10;
      const gap = 4;
      return Math.ceil(padding + (titleLines * lineHeight) + gap + controlsHeight + 14);
    }

    function compactControlsHeight(task, contentWidth) {
      const rowHeight = isUltraOverview() ? 16 : 18;
      const gap = 4;
      const memberWidth = isUltraOverview() ? 42 : 56;
      const statusWidth = isUltraOverview() ? 62 : 70;
      const widths = [];
      if ((task?.members || []).length) widths.push(memberWidth);
      if (task?.type !== "subtask" && (task?.members || []).length > 1) widths.push(memberWidth);
      if (task?.type !== "subtask") widths.push(statusWidth);
      if (!widths.length) return rowHeight;
      let rows = 1;
      let currentWidth = 0;
      widths.forEach((width) => {
        const nextWidth = currentWidth ? currentWidth + gap + width : width;
        if (nextWidth > contentWidth && currentWidth > 0) {
          rows += 1;
          currentWidth = width;
        } else {
          currentWidth = nextWidth;
        }
      });
      return (rows * rowHeight) + ((rows - 1) * gap);
    }

    function rowHeightForLanes(lanes) {
      return Math.max(42, 10 + (Math.max(1, lanes) * laneStep()));
    }

    function buildLaneLayout(projects, tasks = visibleTasks()) {
      const taskLanes = new Map();
      const taskOffsets = new Map();
      const rowHeights = new Map();
      const rowTops = new Map();
      const gap = 8;
      const rangesOverlap = (a, b) => a.startValue < b.endValue && a.endValue > b.startValue;
      const overlapsAt = (top, item, other) => top < other.top + other.height + gap && top + item.height + gap > other.top;
      const firstFreeTop = (item, placed) => {
        const blockers = placed.filter((other) => other !== item && rangesOverlap(item, other));
        const candidates = [0, ...blockers.map((other) => other.top + other.height + gap)].sort((a, b) => a - b);
        return candidates.find((candidate) => !blockers.some((other) => overlapsAt(candidate, item, other))) ?? 0;
      };
      const makeLayoutItem = (task) => {
        const start = parseDate(task.start);
        const end = parseDate(task.end || task.start);
        return {
          id: task.id,
          type: task.type || "task",
          startValue: stripTime(start).getTime(),
          endValue: stripTime(end).getTime() + DAY_MS,
          top: 0,
          height: compactBarHeight(task, estimatedBarWidth(task)),
          lane: 0
        };
      };
      const layoutGroup = (items, topStart = 0) => {
        const placed = [];
        items
          .sort((a, b) => a.startValue - b.startValue || a.endValue - b.endValue || a.id.localeCompare(b.id))
          .forEach((item) => {
            item.top = firstFreeTop(item, placed);
            placed.push(item);
          });
        compactPlaced(placed);
        if (topStart) placed.forEach((item) => { item.top += topStart; });
        return placed;
      };
      const compactPlaced = (placed) => {
        for (let pass = 0; pass < 20; pass += 1) {
          let changed = false;
          placed
            .sort((a, b) => a.top - b.top || a.startValue - b.startValue || a.endValue - b.endValue)
            .forEach((item) => {
              const nextTop = firstFreeTop(item, placed);
              if (nextTop !== item.top) {
                item.top = nextTop;
                changed = true;
              }
            });
          if (!changed) break;
        }
      };
      let maxLanes = 1;
      let totalHeight = 0;
      projects.forEach((project) => {
        const projectItems = tasks
          .filter((task) => task.projectId === project.id)
          .map(makeLayoutItem);
        const mainItems = projectItems.filter((item) => item.type !== "subtask");
        const subtaskItems = projectItems.filter((item) => item.type === "subtask");
        const mainPlaced = layoutGroup(mainItems);
        const mainBottom = mainPlaced.length ? Math.max(...mainPlaced.map((item) => item.top + item.height)) : 0;
        const subtaskTop = mainPlaced.length && subtaskItems.length ? mainBottom + gap : 0;
        const subtaskPlaced = layoutGroup(subtaskItems, subtaskTop);
        const placed = [...mainPlaced, ...subtaskPlaced];
        const tops = [...new Set(placed.map((item) => item.top).sort((a, b) => a - b))];
        placed.forEach((item) => {
          item.lane = tops.indexOf(item.top);
          taskLanes.set(item.id, item.lane);
          taskOffsets.set(item.id, item.top);
        });
        const rowHeightValue = placed.length ? Math.max(42, 16 + Math.max(...placed.map((item) => item.top + item.height))) : 42;
        rowTops.set(project.id, totalHeight);
        rowHeights.set(project.id, rowHeightValue);
        totalHeight += rowHeightValue;
        maxLanes = Math.max(maxLanes, placed.length ? Math.max(...placed.map((item) => item.lane + 1)) : 1);
      });
      return { taskLanes, taskOffsets, rowHeights, rowTops, maxLanes, totalHeight };
    }

    function rangeForTasks(tasks = visibleTasks()) {
      const taskDates = [today, ...tasks.flatMap((task) => [parseDate(task.start), parseDate(task.end)])];
      const min = taskDates.length ? new Date(Math.min(...taskDates)) : today;
      const max = taskDates.length ? new Date(Math.max(...taskDates)) : today;
      const start = new Date(min.getFullYear(), min.getMonth(), 1);
      start.setDate(start.getDate() - 7);
      const end = new Date(max.getFullYear(), max.getMonth() + 1, 0);
      end.setDate(end.getDate() + 14);
      const requiredEnd = new Date(2026, 11, 31);
      if (end < requiredEnd) end.setTime(requiredEnd.getTime());
      return { start, end, totalDays: daysBetween(start, end) };
    }

    function visibleProjects() {
      const member = selectedMember();
      if (!member) {
        return overdueOnly
          ? data.projects.filter((project) => data.tasks.some((task) => task.projectId === project.id && isTaskOverdue(task)))
          : data.projects;
      }
      return data.projects.filter((project) => projectHasRecentMemberActivity(project.id, member));
    }

    function projectHasRecentMemberActivity(projectId, member) {
      return data.tasks.some((task) => {
        if (task.projectId !== projectId) return false;
        if (overdueOnly) return (task.members || []).includes(member) && isTaskOverdue(task);
        if ((task.members || []).includes(member) && isInMemberWindow(task)) return true;
        return (task.subtasks || []).some((subtask) => {
          if (!subtask.start) return false;
          const subtaskMembers = subtask.members || [];
          const assignedToMember = subtaskMembers.includes(member) || (!subtaskMembers.length && (task.members || []).includes(member));
          return assignedToMember && isInMemberWindow(subtask);
        });
      });
    }

    function visibleOoo() {
      if (overdueOnly) return [];
      const member = selectedMember();
      return member ? data.ooo.filter((entry) => entry.member === member && isInMemberWindow(entry)) : data.ooo;
    }

    function visibleRows() {
      const oooRows = visibleOoo().length ? [{ id: oooProjectId, name: "OOO", color: data.oooSettings?.color || "#111111", textColor: data.oooSettings?.textColor || "#ffffff", isOoo: true }] : [];
      return [...oooRows, ...visibleProjects()];
    }

    function visibleTimelineItems() {
      const oooItems = visibleOoo().map((entry) => ({
        ...entry,
        name: entry.member,
        projectId: oooProjectId,
        type: "ooo"
      }));
      return [...oooItems, ...visibleTasks(), ...visibleSubtaskItems()];
    }

    function selectedMember() {
      return viewFilter.value?.startsWith("member:")
        ? viewFilter.value.slice("member:".length)
        : "";
    }

    function visibleTasks() {
      const member = selectedMember();
      let tasks = member
        ? data.tasks.filter((task) => (task.members || []).includes(member) && (overdueOnly ? true : isInMemberWindow(task)))
        : data.tasks;
      if (overdueOnly) tasks = tasks.filter(isTaskOverdue);
      return tasks;
    }

    function taskMembersForCurrentView(task) {
      const members = task.members || [];
      const member = selectedMember();
      if (!member || !members.includes(member)) return members;
      return [member];
    }

    function visibleSubtaskItems() {
      if (overdueOnly) return [];
      const member = selectedMember();
      return data.tasks.flatMap((task) => (task.subtasks || [])
        .filter((subtask) => {
          if (!subtask.start) return false;
          const subtaskMembers = subtask.members || [];
          if (!member) return true;
          const assignedToMember = subtaskMembers.includes(member) || (!subtaskMembers.length && (task.members || []).includes(member));
          return assignedToMember && isInMemberWindow(subtask);
        })
        .map((subtask) => ({
          id: `subtask-${task.id}-${subtask.id}`,
          type: "subtask",
          parentTaskId: task.id,
          subtaskId: subtask.id,
          projectId: task.projectId,
          name: subtask.title || "Sottotask",
          members: (subtask.members || []).length ? subtask.members : (task.members || []),
          start: subtask.start,
          end: subtask.end || subtask.start,
          done: Boolean(subtask.done),
          status: task.status,
          parentName: task.name
        })));
    }

    function isCompactOverview() {
      return zoom <= .5;
    }

    function isUltraOverview() {
      return zoom <= .25;
    }

    function previewWidth(task, status) {
      if (isUltraOverview()) return 110;
      if (isCompactOverview()) {
        return 138;
      }
      const title = String(task.name || "").length * 10;
      const statusWidth = String(status?.name || "").length * 8 + 34;
      const membersWidth = (task.members || []).reduce((total, member) => total + Math.min(108, String(member).length * 8 + 26), 0);
      const subtaskWidth = task.subtasks?.length ? 42 : 0;
      return Math.min(760, Math.max(160, title + statusWidth + membersWidth + subtaskWidth + 116));
    }

    function requiredDayWidth() {
      const widths = visibleTimelineItems().map((task) => {
        if (daysBetween(parseDate(task.start), parseDate(task.end)) !== 1) return 0;
        const status = data.statuses.find((item) => item.name === task.status) || data.statuses[0];
        if (task.type === "subtask") return 136;
        return task.type === "ooo" ? 110 : previewWidth(task, status) + 16;
      });
      return Math.max(0, ...widths);
    }

    function currentViewportAnchorDate() {
      if (!currentTimelineRange || !board.clientWidth) return null;
      const visibleWidth = Math.max(1, board.clientWidth - sidebarWidth());
      const offset = Math.round((board.scrollLeft + visibleWidth / 2) / Math.max(1, dayWidth()));
      return addDays(currentTimelineRange.start, offset);
    }

    function restoreViewportAnchor(date) {
      if (!date || !currentTimelineRange) return;
      const visibleWidth = Math.max(1, board.clientWidth - sidebarWidth());
      const left = Math.max(0, diffDays(date, currentTimelineRange.start) * dayWidth() - visibleWidth / 2);
      board.scrollTo({ left, behavior: "auto" });
    }

    function render() {
      const viewportAnchorDate = currentViewportAnchorDate();
      hideTaskTooltip();
      applyZoom();
      renderFilters();
      currentLaneLayout = buildLaneLayout(visibleRows(), visibleTimelineItems());
      document.documentElement.style.setProperty("--row", `${Math.max(42, Math.round((currentLaneLayout.totalHeight || 42) / Math.max(1, visibleRows().length)))}px`);
      renderRows();
      renderTimeline();
      renderFormOptions();
      renderSettings();
      renderHistory();
      hasRendered = true;
      appRoot.classList.remove("is-booting");
      bootScreen?.remove();
      if (startupAutoScroll) {
        scheduleScrollToToday();
      } else if (viewportAnchorDate) {
        requestAnimationFrame(() => restoreViewportAnchor(viewportAnchorDate));
      }
      requestAnimationFrame(updateScrollHint);
      requestAnimationFrame(updateCurrentMonthIndicator);
    }

    function updateScrollHint() {
      if (!scrollDownHints || !currentTimelineRange) return;
      const boardRect = board.getBoundingClientRect();
      const timelineRect = timeline.getBoundingClientRect();
      const visibleLeft = Math.max(timelineRect.left, boardRect.left + sidebarWidth());
      const visibleRight = boardRect.right;
      const modalOpen = Boolean(document.querySelector(".modal-backdrop.open"));
      if (modalOpen) {
        scrollDownHints.innerHTML = "";
        return;
      }
      const hiddenDays = new Map();
      [...barsEl.querySelectorAll(".bar")]
        .map((bar) => ({ bar, rect: bar.getBoundingClientRect() }))
        .filter(({ rect }) => rect.top > boardRect.bottom - 8)
        .forEach(({ bar, rect }) => {
          const startDate = bar.dataset.startDate;
          if (!startDate) return;
          const dayIndex = diffDays(parseDate(startDate), currentTimelineRange.start);
          const dayLeft = timelineRect.left + dayIndex * dayWidth();
          const dayRight = dayLeft + dayWidth();
          if (dayRight <= visibleLeft || dayLeft >= visibleRight) return;
          const key = String(dayIndex);
          const current = hiddenDays.get(key);
          if (!current || rect.top < current.top) {
            hiddenDays.set(key, { left: dayLeft, top: rect.top, date: startDate });
          }
        });
      const targetTop = Math.min(window.innerHeight - 48, boardRect.bottom - 44);
      scrollDownHints.innerHTML = [...hiddenDays.entries()]
        .sort((a, b) => Number(a[0]) - Number(b[0]))
        .map(([dayIndex, info]) => {
          const targetLeft = clamp(info.left + dayWidth() / 2 - 17, visibleLeft + 8, visibleRight - 42);
          return `<button class="scroll-hint is-visible" data-scroll-hint-day="${dayIndex}" type="button" aria-label="Task nascoste sotto il ${escapeAttr(info.date)}" title="Task nascoste sotto" style="--scroll-hint-left:${targetLeft}px;--scroll-hint-top:${targetTop}px">↓</button>`;
        })
        .join("");
    }

    function updateCurrentMonthIndicator() {
      if (!currentMonthIndicator || !currentTimelineRange) return;
      const boardRect = board.getBoundingClientRect();
      const left = boardRect.left + sidebarWidth() + 12;
      const top = boardRect.top + 7;
      const visibleDayIndex = clamp(Math.floor(board.scrollLeft / dayWidth()), 0, currentTimelineRange.totalDays - 1);
      const visibleDate = addDays(currentTimelineRange.start, visibleDayIndex);
      currentMonthIndicator.textContent = `${monthNames[visibleDate.getMonth()]} ${visibleDate.getFullYear()}`;
      currentMonthIndicator.style.setProperty("--current-month-left", `${left}px`);
      currentMonthIndicator.style.setProperty("--current-month-top", `${top}px`);
    }

    function applyZoom() {
      const baseWidth = Math.round(92 * zoom);
      document.documentElement.classList.toggle("is-compact-overview", isCompactOverview());
      document.documentElement.classList.toggle("is-ultra-overview", isUltraOverview());
      const minOverviewWidth = isUltraOverview() ? 126 : (isCompactOverview() ? 154 : 0);
      document.documentElement.style.setProperty("--day", `${Math.max(baseWidth, requiredDayWidth(), minOverviewWidth)}px`);
      document.getElementById("zoomLabel").textContent = `${Math.round(zoom * 100)}%`;
    }

    function visibleOverdueCount() {
      const member = selectedMember();
      return data.tasks.filter((task) => {
        if (member && !(task.members || []).includes(member)) return false;
        return isTaskOverdue(task);
      }).length;
    }

    function renderFilters() {
      const current = viewFilter.value || "overview";
      const counts = data.members.map((member) => {
        const count = data.tasks.filter((task) => (task.members || []).includes(member.name) && isTaskRelevantForMemberCount(task)).length;
        return `<option value="member:${escapeAttr(member.name)}">${escapeHtml(member.name)} (${count})</option>`;
      }).join("");
      viewFilter.innerHTML = `<option value="overview">Overview</option>${counts}`;
      viewFilter.value = current === "overview" || data.members.some((member) => `member:${member.name}` === current) ? current : "overview";
      const overdueCount = visibleOverdueCount();
      overdueBtn.textContent = `Backlog${overdueCount ? ` (${overdueCount})` : ""}`;
      overdueBtn.classList.toggle("is-active", overdueOnly);
      overdueBtn.setAttribute("aria-pressed", String(overdueOnly));
    }

    function renderRows() {
      rowsEl.innerHTML = visibleRows().map((project) => `
        <div class="member-row" style="height:${currentLaneLayout.rowHeights?.get(project.id) || 42}px">
          <span class="avatar" style="background:${project.color};color:${project.textColor || "#111111"}">${initials(project.name)}</span>
          <span>${escapeHtml(project.name)}</span>
        </div>
      `).join("");
    }

    function renderTimeline() {
      const range = rangeForTasks(visibleTimelineItems());
      currentTimelineRange = range;
      const width = range.totalDays * dayWidth();
      const height = currentLaneLayout.totalHeight || visibleRows().length * rowHeight();
      timeline.style.width = `${width}px`;
      timeline.style.height = `${height + 78}px`;
      gridEl.style.height = `${height}px`;
      weekendsEl.style.height = `${height}px`;
      monthsEl.innerHTML = monthBlocks(range).join("");
      gridEl.innerHTML = projectBands().join("");
      weekendsEl.innerHTML = weekendBands(range, height).join("") + todayMarker(range, height);
      renderBars(range);
      requestAnimationFrame(updateCurrentMonthIndicator);
    }

    function projectBands() {
      return visibleRows().map((project) => {
        const top = currentLaneLayout.rowTops?.get(project.id) || 0;
        const height = currentLaneLayout.rowHeights?.get(project.id) || 42;
        const classes = ["project-band"];
        if (project.isOoo) classes.push("is-ooo");
        return `<div class="${classes.join(" ")}" style="top:${top}px;height:${height}px"></div>`;
      });
    }

    function monthBlocks(range) {
      const blocks = [];
      let cursor = new Date(range.start.getFullYear(), range.start.getMonth(), 1);
      while (cursor <= range.end) {
        const monthStart = new Date(cursor);
        const monthEnd = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0);
        const visibleStart = monthStart < range.start ? range.start : monthStart;
        const visibleEnd = monthEnd > range.end ? range.end : monthEnd;
        const count = daysBetween(visibleStart, visibleEnd);
        const days = [];
        for (let i = 0; i < count; i += 1) {
          const date = addDays(visibleStart, i);
          const classes = ["day"];
          if (date.getDay() === 0 || date.getDay() === 6) classes.push("weekend");
          if (iso(date) === iso(today)) classes.push("today");
          days.push(`<div class="${classes.join(" ")}"><span>${weekday[date.getDay()]}</span><span class="day-number">${date.getDate()}</span></div>`);
        }
        blocks.push(`
          <div class="month" style="width:${count * dayWidth()}px">
            <div class="month-name">${monthNames[monthStart.getMonth()]} ${monthStart.getFullYear()}</div>
            <div class="days">${days.join("")}</div>
          </div>
        `);
        cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
      }
      return blocks;
    }

    function weekendBands(range, height) {
      const bands = [];
      for (let i = 0; i < range.totalDays; i += 1) {
        const date = addDays(range.start, i);
        if (date.getDay() === 0 || date.getDay() === 6) {
          bands.push(`<div class="weekend-band" style="left:${i * dayWidth()}px;width:${dayWidth()}px;height:${height}px"></div>`);
        }
      }
      return bands;
    }

    function todayMarker(range, height) {
      const offset = diffDays(today, range.start);
      if (offset < 0 || offset > range.totalDays) return "";
      return `<div class="today-line" style="left:${offset * dayWidth()}px;height:${height}px"></div>`;
    }

    function scrollToToday(behavior = "auto") {
      const range = currentTimelineRange || rangeForTasks(visibleTimelineItems());
      const left = Math.max(0, diffDays(today, range.start) * dayWidth() - board.clientWidth / 2);
      board.scrollTo({ left, behavior });
    }

    function scheduleScrollToToday(behavior = "auto") {
      requestAnimationFrame(() => scrollToToday(behavior));
    }

    function scrollToTodayCallIfHidden(behavior = "auto") {
      const todayIso = iso(today);
      const calls = [...barsEl.querySelectorAll('[data-task-id^="calendar:"]')]
        .filter((bar) => bar.dataset.startDate === todayIso)
        .sort((left, right) => (parseFloat(left.style.top) || 0) - (parseFloat(right.style.top) || 0));
      if (!calls.length) return;
      const first = calls[0];
      const boardRect = board.getBoundingClientRect();
      const callRect = first.getBoundingClientRect();
      const isVerticallyVisible = callRect.top >= boardRect.top + 72 && callRect.bottom <= boardRect.bottom - 16;
      if (isVerticallyVisible) return;
      const top = Math.max(0, (parseFloat(first.style.top) || 0) - 110);
      board.scrollTo({ top, behavior });
    }

    function scrollToFirstVisibleTask(behavior = "auto") {
      const bars = [...barsEl.querySelectorAll("[data-task-id]")];
      if (!bars.length) return;
      const first = bars
        .map((bar) => ({
          bar,
          left: parseFloat(bar.style.left) || 0,
          top: parseFloat(bar.style.top) || 0
        }))
        .sort((a, b) => a.left - b.left || a.top - b.top)[0];
      const visibleWidth = Math.max(1, board.clientWidth - sidebarWidth());
      const left = Math.max(0, first.left - visibleWidth * .18);
      const top = Math.max(0, first.top - 24);
      board.scrollTo({ left, top, behavior });
    }

    function scheduleScrollToFirstVisibleTask(behavior = "auto") {
      requestAnimationFrame(() => {
        requestAnimationFrame(() => scrollToFirstVisibleTask(behavior));
      });
    }

    function scheduleStartupScrolls() {
      startupAutoScroll = true;
      const session = ++startupScrollSession;
      const startedAt = Date.now();
      const duration = 25000;
      const tick = () => {
        if (session !== startupScrollSession) return;
        scheduleScrollToToday();
        requestAnimationFrame(() => scrollToTodayCallIfHidden());
        if (Date.now() - startedAt < duration) {
          window.setTimeout(tick, 250);
          return;
        }
        startupAutoScroll = false;
      };
      tick();
    }

    function rowTop(projectId) {
      return currentLaneLayout.rowTops?.get(projectId) || 0;
    }

    function taskLaneTop(task, base = 8) {
      return rowTop(task.projectId) + base + (currentLaneLayout.taskOffsets?.get(task.id) || 0);
    }

    function renderBars(range) {
      const rows = visibleRows();
      const rowIds = rows.map((project) => project.id);
      const tasks = visibleTimelineItems().filter((task) => rowIds.includes(task.projectId));
      barsEl.style.height = `${currentLaneLayout.totalHeight || rows.length * rowHeight()}px`;
      barsEl.innerHTML = tasks.map((task) => {
        if (task.type === "ooo") {
          const member = data.members.find((item) => item.name === task.member) || data.members[0];
          const left = diffDays(parseDate(task.start), range.start) * dayWidth() + 8;
          const top = taskLaneTop(task, 8);
          const width = daysBetween(parseDate(task.start), parseDate(task.end)) * dayWidth() - 16;
          const barWidth = Math.max(74, width);
          const barHeight = compactBarHeight(task, barWidth);
          const preview = [`OOO ${task.member}`, `${task.start}${task.end !== task.start ? ` - ${task.end}` : ""}`].join("\n");
          return `
            <div class="bar is-ooo" data-bar-kind="ooo" data-project-id="${escapeAttr(task.projectId)}" data-ooo-id="${task.id}" data-start-date="${task.start}" data-preview="${escapeAttr(preview)}" aria-label="${escapeAttr(preview)}" style="left:${left}px;top:${top}px;width:${barWidth}px;height:${barHeight}px;border-color:${member?.color || "#111111"};background:${member?.color || "#ffffff"};color:${member?.textColor || "#111111"}">
              <span class="bar-title">${escapeHtml(task.member)}</span>
            </div>
          `;
        }
        if (task.type === "subtask") {
          const parent = data.tasks.find((item) => item.id === task.parentTaskId);
          const project = data.projects.find((item) => item.id === task.projectId) || data.projects[0];
          const left = diffDays(parseDate(task.start), range.start) * dayWidth() + 12;
          const top = taskLaneTop(task, 10);
          const width = daysBetween(parseDate(task.start), parseDate(task.end)) * dayWidth() - 24;
          const barWidth = Math.max(92, width);
          const barHeight = compactBarHeight(task, barWidth);
          const memberNames = (task.members || []).slice(0, isCompactOverview() ? 1 : 2);
          const memberBadges = memberNames.map((memberName) => {
            const member = data.members.find((item) => item.name === memberName);
            return `<span class="bar-member" style="background:${member?.color || "#fff"};color:${member?.textColor || "#111111"}">${escapeHtml(memberName)}</span>`;
          }).join("");
          const parentName = parent?.name || task.parentName || "";
          const preview = [
            task.name || "Sottotask",
            `Task: ${parentName}`
          ].join("\n");
          return `
            <div class="bar is-subtask${task.done ? " is-done" : ""}" data-bar-kind="subtask" data-project-id="${escapeAttr(task.projectId)}" data-subtask-bar-id="${escapeAttr(task.id)}" data-subtask-id="${escapeAttr(task.subtaskId)}" data-parent-task-id="${escapeAttr(task.parentTaskId)}" data-start-date="${task.start}" data-preview="${escapeAttr(preview)}" aria-label="${escapeAttr(preview)}" style="left:${left}px;top:${top}px;width:${barWidth}px;height:${barHeight}px;border-color:${project.color}">
              <span class="bar-title">${escapeHtml(task.name)}</span>
              <span class="bar-parent">${escapeHtml(parentName)}</span>
              ${memberBadges}
            </div>
          `;
        }
        const project = data.projects.find((item) => item.id === task.projectId) || data.projects[0];
        const status = data.statuses.find((item) => item.name === task.status) || data.statuses[0];
        const left = diffDays(parseDate(task.start), range.start) * dayWidth() + 8;
        const top = taskLaneTop(task, 8);
        const width = daysBetween(parseDate(task.start), parseDate(task.end)) * dayWidth() - 16;
        const barWidth = Math.max(44, width);
        const barHeight = compactBarHeight(task, barWidth);
        const done = isTaskDone(task) ? " is-done" : "";
        const subtasks = task.subtasks || [];
        const completedSubtasks = subtasks.filter((subtask) => subtask.done).length;
        const subtaskBadge = subtasks.length ? `<span class="bar-subtasks">${completedSubtasks}/${subtasks.length}</span>` : "";
        const compact = isCompactOverview();
        const orderedMembers = taskMembersForCurrentView(task);
        const memberNames = compact ? orderedMembers.slice(0, 1) : orderedMembers;
        const memberBadges = memberNames.map((memberName) => {
          const member = data.members.find((item) => item.name === memberName);
          return `<span class="bar-member" style="background:${member?.color || "#fff"};color:${member?.textColor || "#111111"}">${escapeHtml(memberName)}</span>`;
        }).join("");
        const unassignedBadge = !(task.members || []).length ? `<span class="bar-member bar-unassigned">Task non assegnata</span>` : "";
        const extraMembers = compact && !selectedMember() && (task.members || []).length > 1 ? `<span class="bar-member">+${(task.members || []).length - 1}</span>` : "";
        const statusOptions = data.statuses.map((item) => `<option value="${escapeAttr(item.name)}"${item.name === status.name ? " selected" : ""}>${escapeHtml(item.name)}</option>`).join("");
        const statusBadge = `<select class="bar-status-select" data-task-status="${escapeAttr(task.id)}" title="Cambia status" style="--status-bg:${status.color};--status-text:${status.textColor || "#111111"}">${statusOptions}</select>`;
        const statusDot = `<span class="bar-status-dot" title="${escapeAttr(status.name)}" style="background:${status.color}"></span>`;
        const preview = [
          task.name || "Task",
          `Status: ${status.name || "Nessuno"}`
        ].join("\n");
        return `
          <div class="bar${done}" data-bar-kind="task" data-project-id="${escapeAttr(task.projectId)}" data-task-id="${task.id}" data-start-date="${task.start}" data-preview="${escapeAttr(preview)}" aria-label="${escapeAttr(preview)}" style="left:${left}px;top:${top}px;width:${barWidth}px;height:${barHeight}px;border-color:${project.color}">
            <span class="bar-title">${escapeHtml(task.name)}</span>
            ${subtaskBadge}
            ${memberBadges}
            ${unassignedBadge}
            ${extraMembers}
            ${statusBadge}
            ${statusDot}
            <button class="bar-delete" data-delete-task="${task.id}" type="button" title="Elimina task" onclick="window.nokuDeleteTask(this.dataset.deleteTask); return false;">x</button>
          </div>
        `;
      }).join("") || `<div class="empty">Nessun task visibile. Aggiungi un task o cambia filtro.</div>`;
      compactRenderedBars();
      bindBarControls();
    }

    function compactRenderedBars() {
      const gap = 8;
      const rows = visibleRows();
      const rangesOverlap = (a, b) => a.left < b.right && a.right > b.left;
      const overlapsAt = (top, item, other) => top < other.top + other.height + gap && top + item.height + gap > other.top;
      const firstFreeTop = (item, placed) => {
        const blockers = placed.filter((other) => rangesOverlap(item, other));
        const candidates = [0, ...blockers.map((other) => other.top + other.height + gap)].sort((a, b) => a - b);
        return candidates.find((candidate) => !blockers.some((other) => overlapsAt(candidate, item, other))) ?? 0;
      };
      const compactGroup = (bars, startOffset = 0) => {
        const placed = [];
        bars
          .map((bar) => {
            const left = parseFloat(bar.style.left) || 0;
            const width = parseFloat(bar.style.width) || bar.offsetWidth || 1;
            const measuredHeight = Math.max(parseFloat(bar.style.height) || 0, bar.offsetHeight || 0, bar.scrollHeight + 4);
            bar.style.height = `${measuredHeight}px`;
            const height = measuredHeight || 1;
            return { bar, left, right: left + width, height, top: 0 };
          })
          .sort((a, b) => a.left - b.left || a.right - b.right || a.height - b.height)
          .forEach((item) => {
            item.top = firstFreeTop(item, placed);
            placed.push(item);
          });
        placed.forEach((item) => {
          item.top += startOffset;
          item.bar.style.top = `${item.top}px`;
        });
        return placed;
      };
      let runningTop = 0;
      rows.forEach((project, rowIndex) => {
        const allBars = [...barsEl.querySelectorAll(`.bar[data-project-id="${CSS.escape(project.id)}"]`)];
        const oooBars = allBars.filter((bar) => bar.dataset.barKind === "ooo");
        const mainBars = allBars.filter((bar) => bar.dataset.barKind === "task");
        const subtaskBars = allBars.filter((bar) => bar.dataset.barKind === "subtask");
        const topBase = runningTop + 8;
        const primaryPlaced = project.isOoo ? compactGroup(oooBars, topBase) : compactGroup(mainBars, topBase);
        const primaryBottom = primaryPlaced.length ? Math.max(...primaryPlaced.map((item) => item.top + item.height)) : runningTop + 34;
        const subtaskPlaced = project.isOoo ? [] : compactGroup(subtaskBars, primaryPlaced.length && subtaskBars.length ? primaryBottom + gap : topBase);
        const rowBottom = Math.max(
          runningTop + 42,
          primaryBottom,
          subtaskPlaced.length ? Math.max(...subtaskPlaced.map((item) => item.top + item.height)) : 0
        ) + 8;
        const rowHeightValue = Math.max(42, rowBottom - runningTop);
        currentLaneLayout.rowTops.set(project.id, runningTop);
        currentLaneLayout.rowHeights.set(project.id, rowHeightValue);
        rowsEl.children[rowIndex]?.style.setProperty("height", `${rowHeightValue}px`);
        const band = gridEl.querySelectorAll(".project-band")[rowIndex];
        if (band) {
          band.style.top = `${runningTop}px`;
          band.style.height = `${rowHeightValue}px`;
        }
        runningTop += rowHeightValue;
      });
      currentLaneLayout.totalHeight = Math.max(runningTop, 42);
      barsEl.style.height = `${currentLaneLayout.totalHeight}px`;
      gridEl.style.height = `${currentLaneLayout.totalHeight}px`;
      weekendsEl.style.height = `${currentLaneLayout.totalHeight}px`;
      timeline.style.height = `${currentLaneLayout.totalHeight + 78}px`;
      if (currentTimelineRange) {
        weekendsEl.innerHTML = weekendBands(currentTimelineRange, currentLaneLayout.totalHeight).join("") + todayMarker(currentTimelineRange, currentLaneLayout.totalHeight);
      }
    }

    function renderFormOptions() {
      const taskProject = document.getElementById("taskProject");
      const taskMembers = document.getElementById("taskMembers");
      const taskStatus = document.getElementById("taskStatus");
      const selectedProject = taskProject.value;
      const selectedStatus = taskStatus.value;
      const selectedMembers = [...taskMembers.querySelectorAll("[data-task-member]:checked")].map((input) => input.value);
      taskProject.innerHTML = data.projects.map((project) => `<option value="${project.id}">${escapeHtml(project.name)}</option>`).join("");
      taskMembers.innerHTML = data.members.map((member) => `
        <label class="check-line">
          <input type="checkbox" data-task-member value="${escapeAttr(member.name)}">
          <span>${escapeHtml(member.name)}</span>
        </label>
      `).join("");
      taskStatus.innerHTML = data.statuses.map((status) => `<option value="${escapeHtml(status.name)}">${escapeHtml(status.name)}</option>`).join("");
      if (data.projects.some((project) => project.id === selectedProject)) taskProject.value = selectedProject;
      if (data.statuses.some((status) => status.name === selectedStatus)) taskStatus.value = selectedStatus;
      taskMembers.querySelectorAll("[data-task-member]").forEach((input) => {

    function collectSubtasks(options = {}) {
      return [...subtaskList.querySelectorAll(".subtask-row")]
        .map((row) => {
          let start = row.querySelector("[data-subtask-start]").value;
          const hasEnd = row.querySelector("[data-subtask-has-end]").checked;
          let end = hasEnd ? (row.querySelector("[data-subtask-end]").value || start) : start;
          if (start && end && parseDate(end) < parseDate(start)) [start, end] = [end, start];
          return {
            id: row.dataset.subtaskId || `sub-${Math.random().toString(16).slice(2)}`,
            title: row.querySelector("[data-subtask-title]").value.trim(),
            done: row.querySelector("[data-subtask-done]").checked,
            members: [...row.querySelector("[data-subtask-members]").selectedOptions].map((option) => option.value),
            start,
            end: start ? end : "",
            hasEnd: Boolean(start && hasEnd && end !== start)
          };
        })
        .filter((subtask) => options.keepEmpty || subtask.title);
    }

        if (hasEnd && !endInput.value) endInput.value = startInput?.value || "";

    function hideTaskTooltip() {
      if (!taskTooltip) return;

      taskTooltip.style.transform = "translate(-9999px, -9999px)";

    function moveTaskTooltip(event) {
      if (!taskTooltip || !taskTooltip.classList.contains("open")) return;
      if (!activeTooltipBar || !activeTooltipBar.isConnected || !activeTooltipBar.matches(":hover")) {
        hideTaskTooltip();
        return;
      }
      const margin = 14;
      const rect = taskTooltip.getBoundingClientRect();
      let left = event.clientX + 14;
      let top = event.clientY + 14;
      if (left + rect.width + margin > window.innerWidth) left = event.clientX - rect.width - 14;
      if (top + rect.height + margin > window.innerHeight) top = event.clientY - rect.height - 14;
      taskTooltip.style.transform = `translate(${Math.max(margin, left)}px, ${Math.max(margin, top)}px)`;
    }

    function showTaskTooltip(event, bar) {
      if (!taskTooltip || !isCompactOverview() || !bar?.dataset.preview) return;
      activeTooltipBar = bar;
      taskTooltip.textContent = bar.dataset.preview;
      taskTooltip.classList.add("open");
      moveTaskTooltip(event);
    }

    function duplicateTask(taskId) {
      const task = data.tasks.find((item) => item.id === taskId);
      if (!task) return;
      const copy = {
        ...structuredClone(task),
        id: crypto.randomUUID ? crypto.randomUUID() : `task-${Date.now()}`,
        name: task.name,
        start: iso(addDays(parseDate(task.start), 1)),
        end: iso(addDays(parseDate(task.end), 1))
      };
      data.tasks.push(copy);
      saveData("Duplica task");
      render();
    }

    function deleteTask(taskId) {
      if (!taskId) return;
      markTaskDeleted(taskId);
      data.tasks = data.tasks.filter((task) => task.id !== taskId);
      saveData("Elimina task");
      closeModals();
      hideContextMenu();
      render();
    }

    function deleteOoo(oooId) {
      if (!oooId) return;
      data.ooo = data.ooo.filter((entry) => entry.id !== oooId);
      saveData("Elimina OOO");
      closeModals();
      hideContextMenu();
      render();
    }

    function deleteProject(projectId) {
      if (!projectId) return;
      data.projects = data.projects.filter((project) => project.id !== projectId);
      if (!data.projects.length) {
        data.projects.push({ id: "nuovo-progetto", name: "Nuovo progetto", color: colors[0] });
      }
      data.tasks = data.tasks.map((task) => task.projectId === projectId ? { ...task, projectId: data.projects[0].id } : task);
      saveData("Elimina progetto");
      render();
    }

    function deleteMember(name) {
      if (!name) return;
      data.members = data.members.filter((member) => member.name !== name);
      if (!data.members.length) {
        data.members.push({ name: "Team 1", color: colors[0] });
      }
      data.tasks = data.tasks.map((task) => {
        const members = (task.members || []).filter((member) => member !== name);
        return {
          ...task,
          members: members.length ? members : [data.members[0].name],
          subtasks: (task.subtasks || []).map((subtask) => ({
            ...subtask,
            members: (subtask.members || []).filter((member) => member !== name)
          }))
        };
      });
      data.ooo = data.ooo.filter((entry) => entry.member !== name);
      saveData("Elimina membro");
      render();
    }

    function deleteStatus(name) {
      if (!name) return;
      data.statuses = data.statuses.filter((status) => status.name !== name);
      if (!data.statuses.length) {
        data.statuses.push({ name: "Status 1", color: colors[0] });
      }
      data.tasks = data.tasks.map((task) => task.status === name ? { ...task, status: data.statuses[0].name } : task);
      saveData("Elimina status");
      render();
    }

    function changeTaskStatus(taskId, statusName) {
      const task = data.tasks.find((item) => item.id === taskId);
      const status = data.statuses.find((item) => item.name === statusName);
      if (!task || !status || task.status === status.name) return;
      task.status = status.name;
      task.done = isDoneStatus(status.name);
      if (task.mirrorSource) {
        task.manualStatusOverride = true;
      }
      protectTaskStatus(task);
      saveData("Cambia status task");
      render();
    }

    function focusSubtaskRow(subtaskId) {
      requestAnimationFrame(() => {
        const row = subtaskList.querySelector(`[data-subtask-id="${CSS.escape(subtaskId)}"]`);
        if (!row) return;
        row.scrollIntoView({ block: "center", inline: "nearest" });
        row.querySelector("[data-subtask-title]")?.focus();
      });
    }

    function runSubtaskContextAction(action, parentTaskId = contextSubtaskParentId, subtaskId = contextSubtaskId) {
      const parent = data.tasks.find((task) => task.id === parentTaskId);
      const subtask = parent?.subtasks?.find((item) => item.id === subtaskId);
      if (!parent || !subtask) {
        hideContextMenu();
        return;
      }
      if (action === "edit") {
        hideContextMenu();
        openTask(parent.id);
        focusSubtaskRow(subtask.id);
        return;
      }
      if (action === "toggleDone") {
        subtask.done = !subtask.done;
        saveData(subtask.done ? "Completa sottotask" : "Riapri sottotask");
        hideContextMenu();
        render();
      }
    }

    function runContextAction(action, taskId = contextTaskId) {
      const task = data.tasks.find((item) => item.id === taskId);
      if (!task) {
        hideContextMenu();
        return;
      }
      if (action === "edit") {
        hideContextMenu();
        openTask(task.id);
        return;
      }
      if (action === "addSubtask") {
        task.subtasks = task.subtasks || [];
        task.subtasks.push({ id: `sub-${Math.random().toString(16).slice(2)}`, title: "Nuovo sottotask", done: false, members: [] });
        saveData("Aggiungi sottotask");
        hideContextMenu();
        render();
        openTask(task.id);
        return;
      }
      if (action === "duplicate") {
        hideContextMenu();
        duplicateTask(task.id);
        return;
      }
      if (action === "delete") {
        deleteTask(task.id);
      }
    }

    function runOooContextAction(action, oooId = contextOooId) {
      const entry = data.ooo.find((item) => item.id === oooId);
      if (!entry) {
        hideContextMenu();
        return;
      }
      if (action === "edit") {
        hideContextMenu();
        openOooModal(entry.id);
        return;
      }
      if (action === "delete") {
        deleteOoo(entry.id);
      }
    }

    window.nokuOooContextAction = (action, oooId = contextOooId) => runOooContextAction(action, oooId);
    window.nokuSubtaskContextAction = (action, parentTaskId = contextSubtaskParentId, subtaskId = contextSubtaskId) => runSubtaskContextAction(action, parentTaskId, subtaskId);

        if (project && input.value.trim()) project.name = input.value.trim();
      });
      document.querySelectorAll("[data-project-color]").forEach((input) => {
        const project = data.projects.find((item) => item.id === input.dataset.projectColor);
        if (project) project.color = input.value;
      });
      document.querySelectorAll("[data-project-text-color]").forEach((input) => {
        const project = data.projects.find((item) => item.id === input.dataset.projectTextColor);
        if (project) project.textColor = input.value;
      });
      const oooColor = document.querySelector("[data-ooo-color]");
      const oooTextColor = document.querySelector("[data-ooo-text-color]");
      data.oooSettings = normalizeOooSettings({
        color: oooColor?.value || data.oooSettings?.color,
        textColor: oooTextColor?.value || data.oooSettings?.textColor
      });
      document.querySelectorAll("[data-member-name]").forEach((input) => {
        const oldName = input.dataset.memberName;
        const nextName = input.value.trim();
        const member = data.members.find((item) => item.name === oldName);
        if (!member || !nextName) return;
        member.name = nextName;
        data.tasks = data.tasks.map((task) => ({
          ...task,
          members: (task.members || []).map((memberName) => memberName === oldName ? nextName : memberName),
          subtasks: (task.subtasks || []).map((subtask) => ({
            ...subtask,
            members: (subtask.members || []).map((memberName) => memberName === oldName ? nextName : memberName)
          }))
        }));
        data.ooo = data.ooo.map((entry) => entry.member === oldName ? { ...entry, member: nextName } : entry);
        input.dataset.memberName = nextName;
        const row = input.closest(".settings-row");
        const rowColor = row.querySelector("[data-member-color]");
        const rowTextColor = row.querySelector("[data-member-text-color]");
        const rowDelete = row.querySelector("[data-delete-member]");
        if (rowColor) rowColor.dataset.memberColor = nextName;
        if (rowTextColor) rowTextColor.dataset.memberTextColor = nextName;
        if (rowDelete) rowDelete.dataset.deleteMember = nextName;
      });
      document.querySelectorAll("[data-member-color]").forEach((input) => {
        const member = data.members.find((item) => item.name === input.dataset.memberColor);
        if (member) member.color = input.value;
      });
      document.querySelectorAll("[data-member-text-color]").forEach((input) => {
        const member = data.members.find((item) => item.name === input.dataset.memberTextColor);
        if (member) member.textColor = input.value;
      });
      document.querySelectorAll("[data-status-name]").forEach((input) => {
        const oldName = input.dataset.statusName;
        const nextName = input.value.trim();
        const status = data.statuses.find((item) => item.name === oldName);
        if (!status || !nextName) return;
        status.name = nextName;
        data.tasks = data.tasks.map((task) => task.status === oldName ? { ...task, status: nextName } : task);
        input.dataset.statusName = nextName;
        const row = input.closest(".settings-row");
        const rowColor = row.querySelector("[data-status-color]");
        const rowTextColor = row.querySelector("[data-status-text-color]");
        const rowDelete = row.querySelector("[data-delete-status]");
        if (rowColor) rowColor.dataset.statusColor = nextName;
        if (rowTextColor) rowTextColor.dataset.statusTextColor = nextName;
        if (rowDelete) rowDelete.dataset.deleteStatus = nextName;
      });
      document.querySelectorAll("[data-status-color]").forEach((input) => {
        const status = data.statuses.find((item) => item.name === input.dataset.statusColor);
        if (status) status.color = input.value;
      });

    function finishDrag(event, options = {}) {
      if (!dragState) return;
      if (event?.preventDefault) event.preventDefault();
      const currentDrag = dragState;
      dragState = null;
      try {
        currentDrag.bar.releasePointerCapture?.(currentDrag.pointerId);
      } catch (error) {
        // Pointer capture may already be released by the browser.
      }
      currentDrag.bar.classList.remove("is-dragging");
      if (!currentDrag.moved) {
        return;
      }
      if (options.cancel) {
        render();
        return;
      }
      const task = data.tasks.find((item) => item.id === currentDrag.id);
      if (task) {
        task.start = currentDrag.latestStart;
        task.end = currentDrag.latestEnd;
        task.projectId = currentDrag.latestProjectId;
      }
      saveData("Sposta task");
      render();

      const bar = event.target.closest("[data-task-id]");
      if (!bar) return;
      const task = data.tasks.find((item) => item.id === bar.dataset.taskId);
      if (!task) return;
      hideTaskTooltip();
      hideContextMenu();
      const barRect = bar.getBoundingClientRect();
      const barsRect = barsEl.getBoundingClientRect();
      const range = rangeForTasks(visibleTasks());
      const projects = visibleProjects();
      const originalIndex = projects.findIndex((project) => project.id === task.projectId);
      const safeOriginalIndex = originalIndex === -1 ? 0 : originalIndex;
      bar.setPointerCapture(event.pointerId);
      dragState = {
        id: task.id,
        bar,
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        grabOffsetX: event.clientX - barRect.left,
        grabOffsetY: event.clientY - barRect.top,
        startPointerDay: Math.floor(((event.clientX - barsRect.left) - 8) / dayWidth()),
        startPointerProjectIndex: clamp(Math.floor((event.clientY - barsRect.top) / rowHeight()), 0, Math.max(0, projects.length - 1)),
        rangeStart: range.start,
        durationDays: diffDays(parseDate(task.end), parseDate(task.start)),
        originalStart: parseDate(task.start),
        originalEnd: parseDate(task.end),
        originalProjectId: task.projectId,
        originalProjectIndex: safeOriginalIndex,
        originalLeft: parseFloat(bar.style.left) || 0,
        originalTop: parseFloat(bar.style.top) || 0,
        originalLaneOffset: Math.max(0, (parseFloat(bar.style.top) || 0) - (safeOriginalIndex * rowHeight()) - 12),
        barsLeft: barsRect.left,
        barsTop: barsRect.top,
        moved: false,
        latestStart: task.start,
        latestEnd: task.end,
        latestProjectId: task.projectId
      };
    });

    window.addEventListener("pointermove", (event) => {
      if (!dragState) return;
      const task = data.tasks.find((item) => item.id === dragState.id);
      if (!task) return;
      const rawDeltaX = event.clientX - dragState.startX;
      const rawDeltaY = event.clientY - dragState.startY;
      if (!dragState.moved && Math.hypot(rawDeltaX, rawDeltaY) < 6) return;
      dragState.moved = true;
      dragState.bar.classList.add("is-dragging");
      event.preventDefault();
      const projects = visibleProjects();
      const pointerDay = Math.floor(((event.clientX - dragState.barsLeft) - 8) / dayWidth());
      const pointerTop = event.clientY - dragState.barsTop;
      const dayDelta = pointerDay - dragState.startPointerDay;
      const projectDelta = Math.floor(pointerTop / rowHeight()) - dragState.startPointerProjectIndex;
      const dayIndex = Math.max(0, diffDays(dragState.originalStart, dragState.rangeStart) + dayDelta);
      const nextIndex = clamp(dragState.originalProjectIndex + projectDelta, 0, Math.max(0, projects.length - 1));
      const nextProject = projects[nextIndex];
      const nextStart = addDays(dragState.rangeStart, dayIndex);
      dragState.latestStart = iso(nextStart);
      dragState.latestEnd = iso(addDays(nextStart, dragState.durationDays));
      dragState.latestProjectId = nextProject?.id || dragState.originalProjectId;
      dragState.bar.style.left = `${(dayIndex * dayWidth()) + 8}px`;
      dragState.bar.style.top = `${nextIndex * rowHeight() + 12 + dragState.originalLaneOffset}px`;
    });

        nameInput.dataset.statusName = nextName;
        const row = nameInput.closest(".settings-row");
        const rowColor = row.querySelector("[data-status-color]");
        const rowTextColor = row.querySelector("[data-status-text-color]");
        const rowDelete = row.querySelector("[data-delete-status]");
        if (rowColor) rowColor.dataset.statusColor = nextName;
        if (rowTextColor) rowTextColor.dataset.statusTextColor = nextName;
        if (rowDelete) rowDelete.dataset.deleteStatus = nextName;
      }
      if (colorInput) {
        const status = data.statuses.find((item) => item.name === colorInput.dataset.statusColor);
        if (status) status.color = colorInput.value;
      }
      if (textColorInput) {
        const status = data.statuses.find((item) => item.name === textColorInput.dataset.statusTextColor);
        if (status) status.textColor = textColorInput.value;
      }
      if (isColorChange) {
        previewSetupColors("status");
        return;
      }
      saveData("Modifica setup");
      renderFormOptions();
      renderTimeline();
    });

    document.getElementById("statusList").addEventListener("change", (event) => {
      saveSetupFromDom();
      if (isSetupColorInput(event.target)) previewSetupColors("status");
    });

    document.getElementById("settingsModal").addEventListener("click", (event) => {
      const projectButton = event.target.closest("[data-delete-project]");
      const memberButton = event.target.closest("[data-delete-member]");
      const statusButton = event.target.closest("[data-delete-status]");
      if (!projectButton && !memberButton && !statusButton) return;
      event.preventDefault();
      event.stopPropagation();
      if (projectButton) {
        deleteProject(projectButton.dataset.deleteProject);
        return;
      }
      if (memberButton) {
        deleteMember(memberButton.dataset.deleteMember);
        return;
      }
      deleteStatus(statusButton.dataset.deleteStatus);
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      if (!window.confirm("Vuoi davvero sostituire i dati attuali con la demo? Prima verra salvato un backup automatico.")) return;
      data = normalizeData(structuredClone(starterData));
      saveData("Reset demo");
      render();
    });

    async function bootApp() {
      try {
        const storedPendingSnapshot = loadPendingLocalSnapshot();
        if (storedPendingSnapshot) {
          pendingLocalSnapshot = storedPendingSnapshot;
          pendingRemoteSave = true;
          data = normalizeData(storedPendingSnapshot.data);
          history = Array.isArray(storedPendingSnapshot.history) ? storedPendingSnapshot.history.slice(0, 10) : history;
          dataRevision = storedPendingSnapshot.revision;
          lastSavedData = cloneData(data);
          writeLocalSnapshot(data, history, dataRevision);
        }
        // Non lasciare mai l'interfaccia bloccata mentre Firebase o i mirror rispondono.
        if (!hasRendered) {
          render();
        }
        scheduleStartupScrolls();
        try {
          await startRemoteSync();
        } catch (remoteError) {
          console.warn("Avvio remoto non disponibile: continuo con le sincronizzazioni locali", remoteError);
        }
        startPedSyncSchedule();
        startCalendarSyncSchedule();
        await Promise.allSettled([syncPedMirror(), syncCalendarMirror()]);
        scheduleStartupScrolls();
      } catch (error) {
        console.error(error);
        if (!hasRendered) {
          render();
          const warning = document.createElement("div");
          warning.className = "empty";
          warning.textContent = "Errore di visualizzazione: mostro la copia locale. Usa Cronologia prima di ricaricare.";
          board.appendChild(warning);
        }
        scheduleStartupScrolls();
      }
    }

    window.addEventListener("focus", () => {
      syncPedMirror();
      syncCalendarMirror();
    });
    window.addEventListener("pageshow", () => {
      scheduleStartupScrolls();
    });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        syncPedMirror();
        syncCalendarMirror();
      }
    });

    bootApp();
  </script>
</body>
</html>
