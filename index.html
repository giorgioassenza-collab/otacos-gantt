<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tacos Gantt Board Replica</title>
  <style>
    :root {
      --bg: #f8f9fb;
      --panel: #ffffff;
      --line: #dfe3e8;
      --line-soft: #edf0f3;
      --text: #151a20;
      --muted: #7a8490;
      --chip: #f0f3f6;
      --blue: #147bd1;
      --orange: #ff7a1a;
      --orange-soft: #fff2e8;
      --shadow: 0 1px 2px rgba(16, 24, 40, .08), 0 8px 24px rgba(16, 24, 40, .05);
      --day: 380px;
      --sidebar: 180px;
      --timeline-head: 72px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    button, select {
      font: inherit;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      min-height: 0;
      min-width: 980px;
      background: var(--bg);
    }

    body:not(.is-authenticated) .app,
    body:not(.is-authenticated) .ped-fab,
    body:not(.is-authenticated) .sync,
    body:not(.is-authenticated) .settings-panel,
    body:not(.is-authenticated) .modal-backdrop {
      display: none;
    }

    .login-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background: #fff;
    }

    body.is-authenticated .login-page { display: none; }

    .login-box {
      width: min(560px, 100%);
      display: grid;
      justify-items: center;
      gap: 28px;
      text-align: center;
    }

    .login-logo {
      width: min(440px, 88vw);
      height: auto;
      display: block;
    }

    .login-title {
      margin: 0;
      color: #151a20;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .login-button {
      height: 44px;
      min-width: 148px;
      border: 0;
      border-radius: 10px;
      background: #ff4f0a;
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: .08em;
      cursor: pointer;
      box-shadow: 0 14px 34px rgba(255, 79, 10, .24);
    }

    .login-field {
      width: min(320px, 100%);
      display: grid;
      gap: 8px;
    }

    .login-field input {
      height: 42px;
      border: 1px solid #d3dae2;
      border-radius: 10px;
      padding: 0 12px;
      font: inherit;
      font-size: 14px;
      text-align: center;
    }

    .login-error {
      min-height: 18px;
      color: #c72525;
      font-size: 13px;
      font-weight: 700;
    }

    .toolbar {
      height: 55px;
      flex: 0 0 55px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      box-shadow: var(--shadow);
      z-index: 5;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-right: 8px;
      white-space: nowrap;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--blue);
    }

    .brand-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .month-chip {
      height: 24px;
      padding: 4px 12px;
      border-radius: 8px;
      background: var(--chip);
      color: #66717d;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      white-space: nowrap;
    }

    .spacer { flex: 1; }

    .zoom {
      height: 34px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border-radius: 9px;
      background: var(--chip);
    }

    .icon-btn {
      width: 26px;
      height: 26px;
      border: 0;
      border-radius: 7px;
      display: grid;
      place-items: center;
      color: #707b86;
      background: transparent;
      cursor: pointer;
    }

    .icon-btn:hover { background: #fff; }
    .icon-btn:disabled { opacity: .32; cursor: default; }

    .undo-btn {
      flex: 0 0 auto;
    }

    .zoom-label {
      min-width: 48px;
      text-align: center;
      padding: 0 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #6b7681;
      font-size: 12px;
    }

    .today-btn {
      height: 34px;
      border: 0;
      border-radius: 10px;
      padding: 0 14px;
      color: #ad4e00;
      background: var(--orange-soft);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .toolbar-btn {
      height: 34px;
      border: 0;
      border-radius: 10px;
      padding: 0 12px;
      color: #22405a;
      background: #edf4fb;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .member-select {
      height: 34px;
      width: 156px;
      padding: 0 10px;
      border: 1px solid #cfd6de;
      border-radius: 10px;
      color: #65707b;
      background: #eef2f5;
      font-size: 13px;
      font-weight: 700;
    }

    .board {
      position: relative;
      flex: 1;
      display: grid;
      grid-template-columns: var(--sidebar) 1fr;
      min-height: 0;
      overflow: auto;
    }

    body.ped-mode .board,
    body.ped-mode #openTaskPanel,
    body.ped-mode #openProjectPanel,
    body.ped-mode #memberFilter {
      display: none;
    }

    body:not(.ped-mode) .ped-view,
    body:not(.ped-mode) .ped-only {
      display: none;
    }

    .sidebar {
      background: #fff;
      border-right: 1px solid var(--line);
      min-height: 100%;
    }

    .corner {
      height: var(--timeline-head);
      border-bottom: 1px solid var(--line);
    }

    .row-label {
      height: 48px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 16px;
      border-bottom: 1px solid var(--line-soft);
      color: #3b444e;
      font-size: 13px;
      font-weight: 700;
    }

    .avatar {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      flex: 0 0 auto;
    }

    .project-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      flex: 0 0 auto;
    }

    .timeline-scroll {
      overflow: auto hidden;
      background: var(--bg);
      scrollbar-width: none;
      min-height: 100%;
    }

    .timeline-scroll::-webkit-scrollbar { display: none; }

    .timeline {
      position: relative;
      min-width: max-content;
      min-height: 100%;
    }

    .months {
      display: flex;
      height: var(--timeline-head);
      border-bottom: 1px solid var(--line);
      background: #f9fafb;
    }

    .month {
      position: relative;
      border-right: 1px solid var(--line);
    }

    .month-name {
      position: sticky;
      left: 0;
      z-index: 3;
      width: max-content;
      min-width: 180px;
      height: 34px;
      display: flex;
      align-items: center;
      padding: 0 22px;
      border-bottom: 1px solid var(--line-soft);
      background: #f9fafb;
      color: #333a42;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .13em;
      box-shadow: 12px 0 18px rgba(249, 250, 251, .92);
    }

    .days {
      display: grid;
      height: 38px;
      grid-auto-flow: column;
      grid-auto-columns: var(--day);
    }

    .day {
      position: relative;
      display: grid;
      place-items: center;
      gap: 2px;
      border-right: 1px solid var(--line-soft);
      color: #636e79;
      font-size: 9px;
      line-height: 1;
    }

    .day-weekday {
      color: #8b96a3;
      font-size: 8px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .day-number {
      color: #4b5563;
      font-size: 10px;
      font-weight: 800;
    }

    .day.weekend {
      background: #eceff3;
    }

    .weekends {
      position: absolute;
      inset: var(--timeline-head) 0 0;
      pointer-events: none;
      z-index: 0;
    }

    .weekend-band {
      position: absolute;
      top: 0;
      bottom: 0;
      background: rgba(226, 231, 237, .62);
      border-left: 1px solid rgba(210, 217, 225, .8);
      border-right: 1px solid rgba(210, 217, 225, .8);
    }

    .grid {
      position: absolute;
      inset: var(--timeline-head) 0 0;
      background:
        repeating-linear-gradient(to bottom, transparent 0, transparent 47px, var(--line-soft) 47px, var(--line-soft) 48px),
        var(--bg);
      z-index: 1;
    }

    .bars {
      position: absolute;
      inset: var(--timeline-head) 0 0;
      z-index: 2;
    }

    .bar {
      position: absolute;
      height: 26px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      border-radius: 7px;
      border: 2px solid currentColor;
      color: #111827;
      background: #fff;
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 8px 18px rgba(16, 24, 40, .08);
      white-space: nowrap;
      overflow: hidden;
      gap: 7px;
      cursor: pointer;
      user-select: none;
    }

    .bar.is-done {
      opacity: 1;
      box-shadow: none;
      filter: none;
    }

    .bar.is-done::after {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      top: 50%;
      height: 3px;
      border-radius: 999px;
      background: currentColor;
      transform: translateY(-50%) rotate(-1deg);
      opacity: .9;
      pointer-events: none;
    }

    .bar-title {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bar-home {
      width: 13px;
      height: 13px;
      flex: 0 0 auto;
      color: currentColor;
      opacity: .95;
    }

    .bar-meta {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      opacity: .82;
      font-weight: 700;
    }

    .status-swatch {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      display: inline-block;
      background: #d7dde5;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.35);
    }

    .bar-status-text {
      color: #111827;
    }

    .status-menu,
    .context-menu {
      position: fixed;
      display: none;
      min-width: 164px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 14px 42px rgba(16, 24, 40, .18);
      z-index: 30;
    }

    .status-menu {
      max-height: calc(100vh - 24px);
      overflow: auto;
      overscroll-behavior: contain;
    }

    .status-menu.open,
    .context-menu.open {
      display: grid;
      gap: 4px;
    }

    .status-menu button,
    .context-menu button {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 30px;
      border: 0;
      border-radius: 8px;
      padding: 0 9px;
      color: #243040;
      background: transparent;
      font-size: 12px;
      font-weight: 800;
      text-align: left;
      cursor: pointer;
    }

    .status-menu button:hover,
    .context-menu button:hover {
      background: #f2f5f8;
    }

    .hidden-task-indicator {
      position: absolute;
      width: 24px;
      height: 22px;
      display: grid;
      place-items: center;
      color: #ef4444;
      background: transparent;
      text-shadow: 0 1px 0 #fff, 0 0 10px rgba(239, 68, 68, .28);
      font-size: 18px;
      line-height: 1;
      font-weight: 900;
      pointer-events: none;
      z-index: 4;
    }

    .sync {
      display: none;
    }

    .ped-fab {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 20;
      height: 42px;
      padding: 0 18px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: #111827;
      font-size: 13px;
      font-weight: 900;
      box-shadow: 0 10px 26px rgba(17, 24, 39, .25);
      cursor: pointer;
    }

    .ped-view {
      flex: 1;
      min-height: 0;
      overflow: auto;
      background: var(--bg);
    }

    .ped-calendar {
      position: relative;
      min-width: max-content;
      min-height: 100%;
    }

    .ped-months {
      display: flex;
      height: var(--timeline-head);
      border-bottom: 1px solid var(--line);
      background: #f9fafb;
    }

    .ped-day {
      min-height: 0;
    }

    .ped-layer {
      position: absolute;
      inset: var(--timeline-head) 0 0;
      z-index: 2;
    }

    .ped-grid {
      position: absolute;
      inset: var(--timeline-head) 0 0;
      background:
        repeating-linear-gradient(to right, transparent 0, transparent calc(var(--day) - 1px), var(--line-soft) calc(var(--day) - 1px), var(--line-soft) var(--day)),
        repeating-linear-gradient(to bottom, transparent 0, transparent 77px, var(--line-soft) 77px, var(--line-soft) 78px),
        var(--bg);
      z-index: 1;
    }

    .ped-weekends {
      position: absolute;
      inset: var(--timeline-head) 0 0;
      pointer-events: none;
      z-index: 0;
    }

    .ped-post {
      position: absolute;
      min-height: 64px;
      padding: 7px 9px;
      border: 2px solid #111827;
      border-radius: 8px;
      background: #fff;
      color: #111827;
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(16, 24, 40, .06);
      cursor: pointer;
      overflow: hidden;
    }

    .ped-post small {
      display: block;
      margin-top: 4px;
      color: #667085;
      font-size: 10px;
      font-weight: 800;
    }

    .ped-fields[hidden] {
      display: none;
    }

    .end-date-wrap[hidden] {
      display: none;
    }

    .ped-preview-line {
      margin-top: 4px;
      overflow: hidden;
      color: #334155;
      font-size: 10px;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .social-badge {
      display: inline-grid;
      place-items: center;
      min-width: 18px;
      height: 16px;
      margin-right: 3px;
      border-radius: 4px;
      color: #fff;
      background: #111827;
      font-size: 8px;
      font-weight: 900;
    }

    .manus {
      position: fixed;
      right: 17px;
      bottom: 17px;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 42px;
      padding: 0 14px;
      border-radius: 18px;
      background: #222;
      color: #fff;
      font-size: 12px;
      box-shadow: 0 12px 30px rgba(0,0,0,.22);
    }

    .settings-panel {
      position: fixed;
      top: 64px;
      right: 16px;
      width: 340px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 18px 60px rgba(16, 24, 40, .18);
      transform: translateY(-8px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .16s ease, transform .16s ease;
      z-index: 10;
      max-height: calc(100vh - 82px);
      overflow: auto;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding-top: 92px;
      background: rgba(15, 23, 42, .18);
      z-index: 20;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      width: 360px;
      max-width: calc(100vw - 32px);
      max-height: calc(100vh - 122px);
      overflow: auto;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 24px 80px rgba(16, 24, 40, .24);
    }

    .modal h2 {
      margin: 0 0 14px;
      font-size: 15px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
      position: sticky;
      bottom: -16px;
      padding: 12px 0 0;
      background: #ffffff;
      border-top: 1px solid #e6ebf1;
      z-index: 2;
    }

    .danger-btn {
      height: 34px;
      border: 0;
      border-radius: 9px;
      padding: 0 12px;
      background: #ffe8eb;
      color: #9f1d2d;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      margin-right: auto;
    }

    .settings-panel.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .settings-panel h2 {
      margin: 0 0 12px;
      font-size: 14px;
    }

    .settings-panel h3 {
      margin: 16px 0 10px;
      color: #303943;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .field {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
      color: #56616d;
      font-size: 12px;
      font-weight: 700;
    }

    .field input,
    .field select,
    .field textarea {
      height: 34px;
      border: 1px solid #d3dae2;
      border-radius: 8px;
      padding: 0 10px;
      color: var(--text);
      background: #fff;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
    }

    .field textarea {
      height: 96px;
      padding: 9px 10px;
      resize: vertical;
      line-height: 1.4;
    }

    .inline-check {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      color: #56616d;
      font-size: 12px;
      font-weight: 800;
    }

    .inline-check input {
      width: 15px;
      height: 15px;
      margin: 0;
      accent-color: var(--blue);
    }

    .creator-block {
      display: grid;
      gap: 8px;
      margin: 4px 0 12px;
      padding: 10px;
      border: 1px solid #d3dae2;
      border-radius: 8px;
      background: #f8fafc;
    }

    .creator-block[hidden] { display: none; }

    .creator-block-title {
      color: #56616d;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .field input[type="color"] {
      width: 100%;
      padding: 3px;
      cursor: pointer;
    }

    .field select[multiple] {
      height: 82px;
      padding: 6px;
    }

    .check-list {
      display: grid;
      gap: 6px;
      max-height: 120px;
      overflow: auto;
      padding: 8px;
      border: 1px solid #d3dae2;
      border-radius: 8px;
      background: #fff;
    }

    .check-item {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 24px;
      padding: 3px 4px;
      border-radius: 6px;
      color: #3f4a55;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .check-item:hover {
      background: #f3f6f9;
    }

    .check-item input {
      width: 15px;
      height: 15px;
      margin: 0;
      accent-color: var(--blue);
    }

    .panel-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .panel-footer {
      position: sticky;
      bottom: -16px;
      display: flex;
      justify-content: flex-end;
      margin: 16px -16px -16px;
      padding: 12px 16px 16px;
      border-top: 1px solid #e6ebf1;
      background: #fff;
    }

    .primary-btn,
    .secondary-btn {
      height: 34px;
      border: 0;
      border-radius: 9px;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .primary-btn {
      background: var(--blue);
      color: #fff;
    }

    .secondary-btn {
      background: var(--chip);
      color: #5f6b76;
    }

    .project-list {
      display: grid;
      gap: 6px;
      max-height: 124px;
      overflow: auto;
      margin-top: 10px;
    }

    .stack-list {
      display: grid;
      gap: 6px;
      margin-top: 10px;
      max-height: 110px;
      overflow: auto;
    }

    .project-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 30px;
      border-radius: 8px;
      padding: 0 8px;
      background: #f5f7f9;
      color: #48535e;
      font-size: 12px;
      font-weight: 700;
    }

    .project-pill em {
      color: #7b8793;
      font-style: normal;
      font-weight: 600;
    }

    .project-pill input {
      min-width: 0;
      flex: 1;
      height: 24px;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 0 6px;
      background: transparent;
      color: #48535e;
      font: inherit;
      font-size: 12px;
    }

    .project-pill input[type="color"] {
      width: 30px;
      min-width: 30px;
      height: 24px;
      flex: 0 0 auto;
      padding: 2px;
      border-color: #d3dae2;
      background: #fff;
      cursor: pointer;
    }

    .project-pill input:focus {
      border-color: #c7d2df;
      background: #fff;
      outline: none;
    }

    .project-pill button {
      width: 22px;
      height: 22px;
      border: 0;
      border-radius: 6px;

            });
          }
          if (unsubscribeBoard) unsubscribeBoard();
          unsubscribeBoard = onSnapshot(boardRef, (remoteSnapshot) => {
            if (!remoteSnapshot.exists()) return;
            const remote = remoteSnapshot.data().data;
            if (!remote || applyingRemoteUpdate) return;
            data = normalizeData(remote);
            committedData = structuredClone(data);
            renderBoard();
            renderPed();
            updateUndoButton();
            syncIndicator.textContent = "Sincronizzato live";
          });
          syncIndicator.textContent = "Connesso a Firestore";
          return snapshot.exists() ? normalizeData(snapshot.data().data) : normalizeData(starterData);
        }
        const saved = localStorage.getItem(storageKey);
        syncIndicator.textContent = "Firebase non configurato: salvataggio locale";
        return saved ? normalizeData(JSON.parse(saved)) : normalizeData(starterData);
      } catch {
        syncIndicator.textContent = "Offline: salvataggio locale";
        return normalizeData(starterData);
      }
    }

    async function saveData(skipUndo = false) {
      try {
        syncIndicator.textContent = "Salvataggio...";
        if (!skipUndo && committedData && !sameData(committedData, data)) {
          undoStack.push(structuredClone(committedData));
          if (undoStack.length > 30) undoStack.shift();
          updateUndoButton();
        }
        if (boardRef) {
          applyingRemoteUpdate = true;
          await setDoc(boardRef, {
            data,
            updatedAt: serverTimestamp()
          }, { merge: true });
          applyingRemoteUpdate = false;
          committedData = structuredClone(data);
          updateUndoButton();
          syncIndicator.textContent = "Sincronizzato live";
          return;
        }
        localStorage.setItem(storageKey, JSON.stringify(data));
        committedData = structuredClone(data);
        updateUndoButton();
        syncIndicator.textContent = "Firebase non configurato: salvato locale";
      } catch {
        applyingRemoteUpdate = false;
        localStorage.setItem(storageKey, JSON.stringify(data));
        committedData = structuredClone(data);
        updateUndoButton();
        syncIndicator.textContent = "Offline: salvato locale";
      }
    }

    function renderTimeline() {
      monthsEl.innerHTML = "";
      weekendsEl.innerHTML = "";
      let dayOffset = 0;
      for (let i = 0; i < 13; i += 1) {
        const date = new Date(2026, 5 + i, 1);
        const year = date.getFullYear();
        const month = date.getMonth();
        const total = daysInMonth(year, month);
        const monthEl = document.createElement("section");
        monthEl.className = "month";
        monthEl.style.width = `calc(var(--day) * ${total})`;
        monthEl.innerHTML = `<div class="month-name">${monthNames[month]} ${year}</div>`;
        const daysEl = document.createElement("div");
        daysEl.className = "days";
        for (let day = 1; day <= total; day += 1) {
          const el = document.createElement("div");
          el.className = "day";
          if (year === today.getFullYear() && month === today.getMonth() && day === today.getDate()) {
            el.classList.add("today");
          }
          const dayDate = new Date(year, month, day);
          const weekDay = dayDate.getDay();
          if (weekDay === 0 || weekDay === 6) {
            el.classList.add("weekend");
            const band = document.createElement("div");
            band.className = "weekend-band";
            band.style.left = `calc(var(--day) * ${dayOffset})`;
            band.style.width = "var(--day)";
            weekendsEl.appendChild(band);
          }
          el.innerHTML = `<span class="day-weekday">${weekdayNames[weekDay]}</span><span class="day-number">${day}</span>`;
          daysEl.appendChild(el);
          dayOffset += 1;
        }
        monthEl.appendChild(daysEl);
        monthsEl.appendChild(monthEl);
      }
    }

    function moveItem(list, fromIndex, direction) {
      const toIndex = fromIndex + direction;
      if (fromIndex < 0 || toIndex < 0 || toIndex >= list.length) return list;
      const next = [...list];
      const [item] = next.splice(fromIndex, 1);
      next.splice(toIndex, 0, item);
      return next;
    }

    async function translateToEnglish(text) {
      const source = text.trim();
      if (!source) return "";
      const cacheKey = translationCacheKey(source);
      const cached = localStorage.getItem(cacheKey);
      if (cached) return cached;
      try {
        syncIndicator.textContent = "Traduzione...";
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(source)}&langpair=it|en`;
        const response = await fetch(url);
        if (!response.ok) throw new Error("Translation failed");
        const payload = await response.json();
        const translated = payload?.responseData?.translatedText?.trim();
        const result = translated || source;
        localStorage.setItem(cacheKey, result);
        return result;
      } catch {
        syncIndicator.textContent = "Traduzione non disponibile";
        return source;
      }
    }

    function pedItems() {
      const linkedTasks = data.tasks
        .filter((task) => task.pedEnabled && task.pedDate)
        .map((task) => {
          const project = data.projects.find((item) => item.id === task.projectId);
          const linkedPost = (data.pedPosts || []).find((post) => post.sourceTaskId === task.id);
          return {
            id: `task-${task.id}`,
            title: linkedPost?.title || task.nameEn || task.name,
            date: task.pedDate,
            status: linkedPost?.status || (data.pedStatuses[0] ? statusName(data.pedStatuses[0]) : task.status),
            members: linkedPost?.members || task.members || [],
            social: linkedPost?.social || [],
            format: linkedPost?.format || data.formats[0] || "",
            asset: linkedPost?.asset || "",
            copy: linkedPost?.copy || "",
            color: project ? project.color : statusColor(task.status),
            source: "Gantt"
          };
        });
      const manualPosts = (data.pedPosts || []).map((post) => ({
        ...post,
        color: pedStatusColor(post.status),
        source: "PED"
      })).filter((post) => !post.sourceTaskId);
      return [...linkedTasks, ...manualPosts];
    }

    function socialMarkup(social = []) {
      return social.map((item) => {
        const socialItem = (data.socials || []).find((entry) => entry.id === item);
        return `<span class="social-badge" style="background:${escapeHtml(socialItem ? socialItem.color : "#111827")}">${escapeHtml(socialItem ? socialItem.short : String(item).slice(0, 2).toUpperCase())}</span>`;
      }).join("");
    }

    function renderPed() {
      pedCalendar.innerHTML = "";
      const items = pedItems();
      const months = document.createElement("div");
      months.className = "ped-months";
      const weekends = document.createElement("div");
      weekends.className = "ped-weekends";
      const grid = document.createElement("div");
      grid.className = "ped-grid";
      const layer = document.createElement("div");
      layer.className = "ped-layer";
      let dayOffset = 0;
      const stackByDate = {};
      for (let monthOffset = 0; monthOffset < 13; monthOffset += 1) {
        const date = new Date(2026, 5 + monthOffset, 1);
        const year = date.getFullYear();
        const month = date.getMonth();
        const total = daysInMonth(year, month);
        const monthEl = document.createElement("section");
        monthEl.className = "month";
        monthEl.style.width = `calc(var(--day) * ${total})`;
        monthEl.innerHTML = `<div class="month-name">${monthNames[month]} ${year}</div>`;
        const daysEl = document.createElement("div");
        daysEl.className = "days";
        for (let day = 1; day <= total; day += 1) {
          const dayDate = new Date(year, month, day);
          const weekDay = dayDate.getDay();
          const iso = dateKey(dayDate);
          const el = document.createElement("div");
          el.className = "day";
          if (weekDay === 0 || weekDay === 6) {
            el.classList.add("weekend");
            const band = document.createElement("div");
            band.className = "weekend-band";
            band.style.left = `calc(var(--day) * ${dayOffset})`;
            band.style.width = "var(--day)";
            weekends.appendChild(band);
          }
          el.innerHTML = `<span class="day-weekday">${weekdayNames[weekDay]}</span><span class="day-number">${day}</span>`;
          daysEl.appendChild(el);
          const dayItems = items.filter((item) => item.date === iso);
          stackByDate[iso] = dayItems.length;
          dayItems.forEach((item, itemIndex) => {
            const post = document.createElement("div");
            post.className = "ped-post";
            post.style.left = `calc(var(--day) * ${dayOffset} + 6px)`;
            post.style.top = `${itemIndex * 78 + 10}px`;
            post.style.width = "calc(var(--day) - 12px)";
            post.style.borderColor = item.color || statusColor(item.status);
            if (item.source === "Gantt") {
              post.dataset.taskId = item.id.replace("task-", "");
            } else {
              post.dataset.pedPostId = item.id;
            }
            post.innerHTML = `<div>${socialMarkup(item.social)}${escapeHtml(previewName(item.title))}</div><small>${escapeHtml(item.status || "")}${item.members.length ? ` / ${escapeHtml(item.members.join(", "))}` : ""} / ${escapeHtml(item.format || "-")}</small><div class="ped-preview-line">Asset: ${escapeHtml(item.asset || "-")}</div><div class="ped-preview-line">Copy: ${escapeHtml(item.copy || "-")}</div><div class="ped-preview-line">Who: ${escapeHtml((item.members || []).join(", ") || "-")}</div>`;
            layer.appendChild(post);
          });
          dayOffset += 1;
        }
        monthEl.appendChild(daysEl);
        months.appendChild(monthEl);
      }
      const maxStack = Math.max(1, ...Object.values(stackByDate));
      const height = parseFloat(getComputedStyle(root).getPropertyValue("--timeline-head")) + maxStack * 78 + 24;
      pedCalendar.style.height = `${height}px`;
      pedCalendar.appendChild(months);
      pedCalendar.appendChild(weekends);
      pedCalendar.appendChild(grid);
      pedCalendar.appendChild(layer);
    }

      projectList.innerHTML = "";
      renderSettingsLists();

      data.projects.forEach((project, index) => {

        taskProject.appendChild(item);
        editTaskProject.appendChild(option(project.id, project.name));

        const pill = document.createElement("div");
        pill.className = "project-pill";
        pill.innerHTML = `<input value="${escapeHtml(project.name)}" aria-label="Edit ${escapeHtml(project.name)}" data-edit-project="${escapeHtml(project.id)}"><input type="color" value="${escapeHtml(project.color)}" aria-label="Color ${escapeHtml(project.name)}" data-project-color="${escapeHtml(project.id)}"><button class="move-btn" type="button" aria-label="Move up ${escapeHtml(project.name)}" data-move-project="${escapeHtml(project.id)}" data-move-direction="-1" ${index === 0 ? "disabled" : ""}>Up</button><button class="move-btn" type="button" aria-label="Move down ${escapeHtml(project.name)}" data-move-project="${escapeHtml(project.id)}" data-move-direction="1" ${index === data.projects.length - 1 ? "disabled" : ""}>Down</button><button type="button" aria-label="Delete ${escapeHtml(project.name)}" data-delete-project="${escapeHtml(project.id)}">x</button>`;
        projectList.appendChild(pill);
      });

      const visibleProjects = data.projects.filter((project) => {
        if (selectedMember === "all") return true;
        return data.tasks.some((task) => task.projectId === project.id && task.members.includes(selectedMember));
      });

      let projectTop = 0;
      visibleProjects.forEach((project) => {
        const visibleTasks = data.tasks
          .filter((task) => task.projectId === project.id)
          .filter((task) => selectedMember === "all" || task.members.includes(selectedMember));
        const rowHeight = Math.max(48, visibleTasks.length * 34 + 14);
        const row = document.createElement("div");
        row.className = "row-label";
        row.style.height = `${rowHeight}px`;
        row.innerHTML = `<span class="project-dot" style="background:${project.color}"></span>${escapeHtml(project.name)}`;
        sidebar.appendChild(row);

        visibleTasks
          .forEach((task, taskIndex) => {
            const start = new Date(`${task.start}T00:00:00`);
            const end = new Date(`${task.end}T00:00:00`);
            const left = Math.max(0, dateDiffDays(timelineStart, start)) * parseFloat(getComputedStyle(root).getPropertyValue("--day"));
            const width = Math.max(1, dateDiffDays(start, end) + 1) * parseFloat(getComputedStyle(root).getPropertyValue("--day"));
            const bar = document.createElement("div");
            bar.className = "bar";
            if (isDoneStatus(task.status)) {
              bar.classList.add("is-done");
            }
            bar.title = `${task.name}\nChi: ${(task.members || []).join(", ") || "-"}`;
            bar.style.left = `${left}px`;
            bar.style.top = `${projectTop + taskIndex * 34 + 11}px`;
            bar.style.width = `${width}px`;
            bar.style.borderColor = project.color;
            bar.dataset.taskId = task.id;
            const compactPreview = zoomIndex <= 1;
            bar.innerHTML = `${compactPreview ? "" : taskLabelIconMarkup(task.label)}<span class="bar-title">${escapeHtml(previewName(task.nameEn || task.name))}</span><span class="bar-meta"><span class="status-swatch" style="background:${escapeHtml(statusColor(task.status))}"></span>${compactPreview ? "" : `<span class="bar-status-text">${escapeHtml(task.status)}</span>`}</span>`;
            bars.appendChild(bar);
          });
        projectTop += rowHeight;
      });

      if (!visibleProjects.length) {
        const row = document.createElement("div");
        row.className = "row-label";
        row.textContent = selectedMember === "all" ? "No projects" : "No tasks";
        sidebar.appendChild(row);
        projectTop = 48;
      }

      const bottomScrollBuffer = 260;
      const boardContentHeight = parseFloat(getComputedStyle(root).getPropertyValue("--timeline-head")) + projectTop + bottomScrollBuffer;
      sidebar.style.minHeight = `${boardContentHeight}px`;
      timelineEl.style.minHeight = `${boardContentHeight}px`;
      bars.style.height = `${projectTop + bottomScrollBuffer}px`;

      taskProject.disabled = data.projects.length === 0;
      updateHiddenTaskIndicators();
    }

    function updateHiddenTaskIndicators() {
      bars.querySelectorAll(".hidden-task-indicator").forEach((indicator) => indicator.remove());
      if (document.body.classList.contains("ped-mode")) return;
      const timelineHead = parseFloat(getComputedStyle(root).getPropertyValue("--timeline-head"));
      const dayWidth = parseFloat(getComputedStyle(root).getPropertyValue("--day"));
      const visibleBottomInBars = boardEl.scrollTop + boardEl.clientHeight - timelineHead;
      const indicatorTop = Math.max(6, Math.min(parseFloat(bars.style.height || "0") - 24, visibleBottomInBars - 28));
      const hiddenColumns = new Set();

      bars.querySelectorAll(".bar[data-task-id]").forEach((bar) => {
        const top = parseFloat(bar.style.top || "0");
        const bottom = top + bar.offsetHeight;
        if (bottom <= visibleBottomInBars) return;
        const left = parseFloat(bar.style.left || "0");
        hiddenColumns.add(Math.round(left / dayWidth) * dayWidth);
      });

      hiddenColumns.forEach((left) => {
        const indicator = document.createElement("div");
        indicator.className = "hidden-task-indicator";
        indicator.style.left = `${left + Math.min(dayWidth - 30, 18)}px`;
        indicator.style.top = `${indicatorTop}px`;
        indicator.textContent = "↓";
        bars.appendChild(indicator);
      });
    }

      event.preventDefault();
      taskContextMenu.dataset.taskId = bar.dataset.taskId;
      taskContextMenu.style.left = `${Math.min(event.clientX, window.innerWidth - 190)}px`;
      taskContextMenu.style.top = `${Math.min(event.clientY, window.innerHeight - 120)}px`;
      taskContextMenu.classList.add("open");
      statusMenu.classList.remove("open");
    });

    taskContextMenu.addEventListener("click", (event) => {
      const button = event.target.closest("[data-context-action]");
      if (!button) return;
      const taskId = taskContextMenu.dataset.taskId;
      const task = data.tasks.find((item) => item.id === taskId);
      if (!task) return;
      if (button.dataset.contextAction === "modify") {
        hideTaskMenus();
        closePanels();
        openTaskEditor(taskId);
        return;
      }
      if (button.dataset.contextAction === "delete") {
        data.tasks = data.tasks.filter((item) => item.id !== taskId);
      }
      if (button.dataset.contextAction === "move-next") {
        const originalStart = task.start;
        const originalEnd = task.end || task.start;
        task.start = shiftDateString(originalStart, 1);
        task.end = shiftDateString(originalEnd, 1);
        task.pedDate = task.pedEnabled && task.pedDate ? shiftDateString(task.pedDate, 1) : task.pedDate;
      }
      saveData();
      renderBoard();
      renderPed();
      hideTaskMenus();
    });

    document.addEventListener("click", (event) => {
      if (event.target.closest(".bar") || event.target.closest(".status-menu") || event.target.closest(".context-menu")) return;
      hideTaskMenus();
    });

    pedCalendar.addEventListener("dblclick", (event) => {
      const post = event.target.closest(".ped-post");
      if (!post) return;
      closePanels();
      if (post.dataset.taskId) {
        openLinkedPedTaskEditor(post.dataset.taskId);
        return;
      }
      if (post.dataset.pedPostId) openPedPostEditor(post.dataset.pedPostId);
    });

    document.getElementById("closeTaskModal").addEventListener("click", closeTaskEditor);
    taskModal.addEventListener("click", (event) => {
      if (event.target === taskModal) closeTaskEditor();
    });

    document.getElementById("editTaskPedEnabled").addEventListener("change", (event) => {
      document.getElementById("editTaskPedFields").hidden = !event.target.checked;
      if (event.target.checked && !document.getElementById("editTaskPedDate").value) {
        document.getElementById("editTaskPedDate").value = document.getElementById("editTaskStart").value;
      }
    });

    document.getElementById("closePedPostModal").addEventListener("click", closePedPostEditor);
    pedPostModal.addEventListener("click", (event) => {
      if (event.target === pedPostModal) closePedPostEditor();
    });

    document.getElementById("deletePedPostButton").addEventListener("click", () => {
      const postId = document.getElementById("editPedPostId").value;
      if (!postId) return;
      data.pedPosts = (data.pedPosts || []).filter((post) => post.id !== postId);
      saveData();
      renderPed();
      closePedPostEditor();
    });

    document.getElementById("deleteTaskButton").addEventListener("click", () => {
      const taskId = document.getElementById("editTaskId").value;
      if (!taskId) return;
      data.tasks = data.tasks.filter((task) => task.id !== taskId);
      saveData();
      renderBoard();
      closeTaskEditor();
    });

    document.getElementById("addSubtaskButton").addEventListener("click", () => {
      const taskId = document.getElementById("editTaskId").value;
      const task = data.tasks.find((item) => item.id === taskId);
      if (!task) return;
      const title = document.getElementById("newSubtaskTitle").value.trim();
      const members = selectedMembers(newSubtaskMembers);
      if (!title || !members.length) return;
      task.subtasks = task.subtasks || [];
      task.subtasks.push({ id: `s${Date.now()}`, title, members, done: false });
      document.getElementById("newSubtaskTitle").value = "";
      newSubtaskMembers.querySelectorAll("input[type='checkbox']").forEach((input) => { input.checked = false; });
      saveData();
      renderSubtasks(task);
    });

    subtaskList.addEventListener("change", (event) => {
      const checkbox = event.target.closest("[data-subtask-done]");
      if (!checkbox) return;
      const taskId = document.getElementById("editTaskId").value;
      const task = data.tasks.find((item) => item.id === taskId);
      if (!task) return;
      const subtask = (task.subtasks || []).find((item) => item.id === checkbox.dataset.subtaskDone);
      if (!subtask) return;
      subtask.done = checkbox.checked;
      saveData();
      renderSubtasks(task);
    });

    subtaskList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-delete-subtask]");
      if (!button) return;
      const taskId = document.getElementById("editTaskId").value;
      const task = data.tasks.find((item) => item.id === taskId);
      if (!task) return;
      task.subtasks = (task.subtasks || []).filter((item) => item.id !== button.dataset.deleteSubtask);
      saveData();
      renderSubtasks(task);
    });

    document.getElementById("addPedSubtaskButton").addEventListener("click", () => {
      const postId = document.getElementById("editPedPostId").value;
      const post = (data.pedPosts || []).find((item) => item.id === postId);
      if (!post) return;
      const title = document.getElementById("newPedSubtaskTitle").value.trim();
      const members = selectedMembers(newPedSubtaskMembers);
      if (!title || !members.length) return;
      post.subtasks = post.subtasks || [];
      post.subtasks.push({ id: `ps${Date.now()}`, title, members, done: false });
      document.getElementById("newPedSubtaskTitle").value = "";
      newPedSubtaskMembers.querySelectorAll("input[type='checkbox']").forEach((input) => { input.checked = false; });
      saveData();
      renderPedSubtasks(post);
    });

    pedSubtaskList.addEventListener("change", (event) => {
      const checkbox = event.target.closest("[data-ped-subtask-done]");
      if (!checkbox) return;
      const postId = document.getElementById("editPedPostId").value;
      const post = (data.pedPosts || []).find((item) => item.id === postId);
      if (!post) return;
      const subtask = (post.subtasks || []).find((item) => item.id === checkbox.dataset.pedSubtaskDone);
      if (!subtask) return;
      subtask.done = checkbox.checked;
      saveData();
      renderPedSubtasks(post);
    });

    pedSubtaskList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-delete-ped-subtask]");
      if (!button) return;
      const postId = document.getElementById("editPedPostId").value;
      const post = (data.pedPosts || []).find((item) => item.id === postId);
      if (!post) return;
      post.subtasks = (post.subtasks || []).filter((item) => item.id !== button.dataset.deletePedSubtask);
      saveData();
      renderPedSubtasks(post);
    });

    document.getElementById("editTaskForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const taskId = document.getElementById("editTaskId").value;
      const task = data.tasks.find((item) => item.id === taskId);
      if (!task) return;
      const projectId = editTaskProject.value;
      const name = document.getElementById("editTaskName").value.trim();
      const status = editTaskStatus.value;
      const members = selectedMembers(editTaskMembers);
      const start = document.getElementById("editTaskStart").value;
      const end = document.getElementById("editTaskAddEndDate").checked ? document.getElementById("editTaskEnd").value : start;
      const label = editTaskLabel.value;
      const info = document.getElementById("editTaskInfo").value.trim();
      const pedEnabled = document.getElementById("editTaskPedEnabled").checked;
      const pedDate = document.getElementById("editTaskPedDate").value || start;
      if (!projectId || !name || !status || !members.length || !start || !end) return;
      const nameEn = task.name === name && task.nameEn ? task.nameEn : await translateToEnglish(name);
      task.name = name;
      task.nameEn = nameEn;
      task.projectId = projectId;
      task.status = status;
      task.members = members;
      task.start = start;
      task.end = end < start ? start : end;
      task.label = label;
      task.info = info;
      task.pedEnabled = pedEnabled;
      task.pedDate = pedDate;
      saveData();
      renderBoard();
      renderPed();
      closeTaskEditor();
    });

    document.getElementById("editPedPostForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const postId = document.getElementById("editPedPostId").value;
      const post = (data.pedPosts || []).find((item) => item.id === postId);
      if (!post) return;
      const title = document.getElementById("editPedPostTitle").value.trim();
      const date = document.getElementById("editPedPostDate").value;
      const status = editPedPostStatus.value;
      const members = selectedMembers(editPedPostMembers);
      const social = selectedValues(editPedPostSocials);
      const format = editPedPostFormat.value;
      if (!title || !date || !status || !format) return;
      post.title = title;
      post.date = post.sourceTaskId ? post.date : date;
      post.status = status;
      post.members = members;
      post.social = social;
      post.format = format;
      post.asset = document.getElementById("editPedPostAsset").value.trim();
      post.copy = document.getElementById("editPedPostCopy").value.trim();
      saveData();
      renderPed();
      closePedPostEditor();
    });

    document.getElementById("memberForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const member = document.getElementById("memberName").value.trim();
      if (!member || data.members.includes(member)) return;
      data.members.push(member);
      saveData();
      renderBoard();
      document.getElementById("memberName").value = "New person";
    });

    document.getElementById("statusForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const status = document.getElementById("statusName").value.trim();
      if (!status || data.statuses.some((item) => statusName(item) === status)) return;
      data.statuses.push({ name: status, color: "#6b7280" });
      saveData();
      renderBoard();
      document.getElementById("statusName").value = "New status";
    });

    document.getElementById("labelForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const label = document.getElementById("labelName").value.trim();
      if (!label || data.labels.includes(label)) return;
      data.labels.push(label);
      saveData();
      renderBoard();
      document.getElementById("labelName").value = "New label";
    });

    document.getElementById("socialForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const label = document.getElementById("socialName").value.trim();
      const short = document.getElementById("socialShort").value.trim().toUpperCase();
      const color = document.getElementById("socialColor").value;
      const id = slugify(label);
      if (!label || !short || data.socials.some((social) => social.id === id || social.label === label)) return;
      data.socials.push({ id, label, short, color });
      saveData();
      renderBoard();
      renderPed();
      document.getElementById("socialName").value = "New social";
      document.getElementById("socialShort").value = "NS";
      document.getElementById("socialColor").value = "#111827";
    });

    projectList.addEventListener("click", (event) => {
      const moveButton = event.target.closest("[data-move-project]");
      if (moveButton) {
        const index = data.projects.findIndex((project) => project.id === moveButton.dataset.moveProject);
        data.projects = moveItem(data.projects, index, Number(moveButton.dataset.moveDirection));
        saveData();
        renderBoard();
        return;
      }
      const button = event.target.closest("[data-delete-project]");
      if (!button) return;
      const id = button.dataset.deleteProject;
      data.projects = data.projects.filter((project) => project.id !== id);
      data.tasks = data.tasks.filter((task) => task.projectId !== id);
      saveData();
      renderBoard();
    });

    projectList.addEventListener("change", (event) => {
      const nameInput = event.target.closest("[data-edit-project]");
      if (nameInput) {
        const project = data.projects.find((item) => item.id === nameInput.dataset.editProject);
        const name = nameInput.value.trim();
        if (!project || !name || data.projects.some((item) => item.id !== project.id && item.name === name)) {
          renderBoard();
          return;
        }
        project.name = name;
        saveData();
        renderBoard();
        return;
      }
      const colorInput = event.target.closest("[data-project-color]");
      if (!colorInput) return;
      const project = data.projects.find((item) => item.id === colorInput.dataset.projectColor);
      if (!project) return;
      project.color = colorInput.value;
      saveData();
      renderBoard();
    });

    memberList.addEventListener("click", (event) => {
      const moveButton = event.target.closest("[data-move-member]");
      if (moveButton) {
        const index = data.members.indexOf(moveButton.dataset.moveMember);
        data.members = moveItem(data.members, index, Number(moveButton.dataset.moveDirection));
        saveData();
        renderBoard();
        return;
      }
      const button = event.target.closest("[data-delete-member]");
      if (!button) return;
      const member = button.dataset.deleteMember;
      data.members = data.members.filter((item) => item !== member);
      data.tasks = data.tasks
        .map((task) => ({ ...task, members: task.members.filter((item) => item !== member) }))
        .filter((task) => task.members.length > 0);
      saveData();
      renderBoard();
    });

    memberList.addEventListener("change", (event) => {
      const input = event.target.closest("[data-edit-member]");
      if (!input) return;
      const oldMember = input.dataset.editMember;
      const newMember = input.value.trim();
      if (!newMember || (newMember !== oldMember && data.members.includes(newMember))) {
        renderBoard();
        return;
      }
      data.members = data.members.map((item) => item === oldMember ? newMember : item);
      data.tasks = data.tasks.map((task) => ({
        ...task,
        members: task.members.map((item) => item === oldMember ? newMember : item)
      }));
      saveData();
      renderBoard();
    });

    statusList.addEventListener("click", (event) => {
      const moveButton = event.target.closest("[data-move-status]");
      if (moveButton) {
        const index = data.statuses.findIndex((item) => statusName(item) === moveButton.dataset.moveStatus);
        data.statuses = moveItem(data.statuses, index, Number(moveButton.dataset.moveDirection));
        saveData();
        renderBoard();
        return;
      }
      const button = event.target.closest("[data-delete-status]");
      if (!button) return;
      const status = button.dataset.deleteStatus;
      data.statuses = data.statuses.filter((item) => statusName(item) !== status);
      const fallback = data.statuses[0] ? statusName(data.statuses[0]) : "";
      data.tasks = data.tasks.map((task) => task.status === status ? { ...task, status: fallback } : task);
      if (!fallback) data.tasks = [];
      saveData();
      renderBoard();
    });

    statusList.addEventListener("change", (event) => {
      const input = event.target.closest("[data-edit-status]");
      if (!input) return;
      const oldStatus = input.dataset.editStatus;
      const newStatus = input.value.trim();
      if (!newStatus || (newStatus !== oldStatus && data.statuses.some((item) => statusName(item) === newStatus))) {
        renderBoard();
        return;
      }
      data.statuses = data.statuses.map((item) => statusName(item) === oldStatus ? { ...item, name: newStatus } : item);
      data.tasks = data.tasks.map((task) => task.status === oldStatus ? { ...task, status: newStatus } : task);
      saveData();
      renderBoard();
    });

    statusList.addEventListener("change", (event) => {
      const input = event.target.closest("[data-status-color]");
      if (!input) return;
      const status = data.statuses.find((item) => statusName(item) === input.dataset.statusColor);
      if (!status || typeof status === "string") return;
      status.color = input.value;
      saveData();
      renderBoard();
    });

    labelList.addEventListener("click", (event) => {
      const moveButton = event.target.closest("[data-move-label]");
      if (moveButton) {
        const index = data.labels.indexOf(moveButton.dataset.moveLabel);
        data.labels = moveItem(data.labels, index, Number(moveButton.dataset.moveDirection));
        saveData();
        renderBoard();
        return;
      }
      const button = event.target.closest("[data-delete-label]");
      if (!button) return;
      const label = button.dataset.deleteLabel;
      data.labels = data.labels.filter((item) => item !== label);
      data.tasks = data.tasks.map((task) => task.label === label ? { ...task, label: "" } : task);
      saveData();
      renderBoard();
    });

    labelList.addEventListener("change", (event) => {
      const input = event.target.closest("[data-edit-label]");
      if (!input) return;
      const oldLabel = input.dataset.editLabel;
      const newLabel = input.value.trim();
      if (!newLabel || (newLabel !== oldLabel && data.labels.includes(newLabel))) {
        renderBoard();
        return;
      }
      data.labels = data.labels.map((item) => item === oldLabel ? newLabel : item);
      data.tasks = data.tasks.map((task) => task.label === oldLabel ? { ...task, label: newLabel } : task);
      saveData();
      renderBoard();
    });

    pedStatusList.addEventListener("click", (event) => {
      const moveButton = event.target.closest("[data-move-ped-status]");
      if (moveButton) {
        const index = data.pedStatuses.findIndex((item) => statusName(item) === moveButton.dataset.movePedStatus);
        data.pedStatuses = moveItem(data.pedStatuses, index, Number(moveButton.dataset.moveDirection));
        saveData();
        renderBoard();
        renderPed();
        return;
      }
      const button = event.target.closest("[data-delete-ped-status]");
      if (!button) return;
      const status = button.dataset.deletePedStatus;
      data.pedStatuses = data.pedStatuses.filter((item) => statusName(item) !== status);
      const fallback = data.pedStatuses[0] ? statusName(data.pedStatuses[0]) : "";
      data.pedPosts = (data.pedPosts || []).map((post) => post.status === status ? { ...post, status: fallback } : post);
      saveData();
      renderBoard();
      renderPed();
    });

    pedStatusList.addEventListener("change", (event) => {
      const input = event.target.closest("[data-edit-ped-status]");
      if (input) {
        const oldStatus = input.dataset.editPedStatus;
        const newStatus = input.value.trim();
        if (!newStatus || (newStatus !== oldStatus && data.pedStatuses.some((item) => statusName(item) === newStatus))) {
          renderBoard();
          return;
        }
        data.pedStatuses = data.pedStatuses.map((item) => statusName(item) === oldStatus ? { ...item, name: newStatus } : item);
        data.pedPosts = (data.pedPosts || []).map((post) => post.status === oldStatus ? { ...post, status: newStatus } : post);
        saveData();
        renderBoard();
        renderPed();
        return;
      }
      const colorInput = event.target.closest("[data-ped-status-color]");
      if (!colorInput) return;
      const status = data.pedStatuses.find((item) => statusName(item) === colorInput.dataset.pedStatusColor);
      if (!status || typeof status === "string") return;
      status.color = colorInput.value;
      saveData();
      renderBoard();
      renderPed();
    });

    formatList.addEventListener("click", (event) => {
      const moveButton = event.target.closest("[data-move-format]");
      if (moveButton) {
        const index = data.formats.indexOf(moveButton.dataset.moveFormat);
        data.formats = moveItem(data.formats, index, Number(moveButton.dataset.moveDirection));
        saveData();
        renderBoard();
        renderPed();
        return;
      }
      const button = event.target.closest("[data-delete-format]");
      if (!button) return;
      const format = button.dataset.deleteFormat;
      data.formats = data.formats.filter((item) => item !== format);
      const fallback = data.formats[0] || "";
      data.pedPosts = (data.pedPosts || []).map((post) => post.format === format ? { ...post, format: fallback } : post);
      saveData();
      renderBoard();
      renderPed();
    });

    formatList.addEventListener("change", (event) => {
      const input = event.target.closest("[data-edit-format]");
      if (!input) return;
      const oldFormat = input.dataset.editFormat;
      const newFormat = input.value.trim();
      if (!newFormat || (newFormat !== oldFormat && data.formats.includes(newFormat))) {
        renderBoard();
        return;
      }
      data.formats = data.formats.map((item) => item === oldFormat ? newFormat : item);
      data.pedPosts = (data.pedPosts || []).map((post) => post.format === oldFormat ? { ...post, format: newFormat } : post);
      saveData();
      renderBoard();
      renderPed();
    });

    document.getElementById("pedStatusForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const status = document.getElementById("pedStatusName").value.trim();
      if (!status || data.pedStatuses.some((item) => statusName(item) === status)) return;
      data.pedStatuses.push({ name: status, color: "#6b7280" });
      saveData();
      renderBoard();
      renderPed();
      document.getElementById("pedStatusName").value = "New PED status";
    });

    document.getElementById("formatForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const format = document.getElementById("formatName").value.trim();
      if (!format || data.formats.includes(format)) return;
      data.formats.push(format);
      saveData();
      renderBoard();
      renderPed();
      document.getElementById("formatName").value = "New format";
    });

    socialList.addEventListener("click", (event) => {
      const moveButton = event.target.closest("[data-move-social]");
      if (moveButton) {
        const index = data.socials.findIndex((item) => item.id === moveButton.dataset.moveSocial);
        data.socials = moveItem(data.socials, index, Number(moveButton.dataset.moveDirection));
        saveData();
        renderBoard();
        renderPed();
        return;
      }
      const button = event.target.closest("[data-delete-social]");
      if (!button) return;
      const id = button.dataset.deleteSocial;
      data.socials = data.socials.filter((item) => item.id !== id);
      data.pedPosts = (data.pedPosts || []).map((post) => ({
        ...post,
        social: (post.social || []).filter((item) => item !== id)
      }));
      saveData();
      renderBoard();
      renderPed();
    });

    socialList.addEventListener("change", (event) => {
      const nameInput = event.target.closest("[data-edit-social]");
      if (nameInput) {
        const social = data.socials.find((item) => item.id === nameInput.dataset.editSocial);
        const label = nameInput.value.trim();
        if (!social || !label || data.socials.some((item) => item.id !== social.id && item.label === label)) {
          renderBoard();
          return;
        }
        social.label = label;
        saveData();
        renderBoard();
        renderPed();
        return;
      }
      const shortInput = event.target.closest("[data-social-short]");
      if (shortInput) {
        const social = data.socials.find((item) => item.id === shortInput.dataset.socialShort);
        const short = shortInput.value.trim().toUpperCase();
        if (!social || !short) {
          renderBoard();
          return;
        }
        social.short = short;
        saveData();
        renderBoard();
        renderPed();
        return;
      }
      const colorInput = event.target.closest("[data-social-color]");
      if (!colorInput) return;
      const social = data.socials.find((item) => item.id === colorInput.dataset.socialColor);
      if (!social) return;
      social.color = colorInput.value;
      saveData();
      renderBoard();
      renderPed();
    });

    memberFilter.addEventListener("change", renderBoard);
    boardEl.addEventListener("scroll", updateHiddenTaskIndicators);

    document.getElementById("resetBoard").addEventListener("click", () => {
      data = structuredClone(starterData);
      saveData();
      renderBoard();
      renderPed();
      scrollToToday();
    });
  </script>
</body>
