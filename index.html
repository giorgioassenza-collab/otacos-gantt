        hasEnd: endOffset !== startOffset,
        status,
        done: false,
        notes: "",
        subtasks: [
          { id: `sub-${Math.random().toString(16).slice(2)}`, title: "Brief", done: false },
          { id: `sub-${Math.random().toString(16).slice(2)}`, title: "Review", done: false }
        ]
      };
    }

    function allDataKeys() {
      const known = [stableStorageKey, storageKey, ...legacyStorageKeys];
      try {
        for (let index = 0; index < localStorage.length; index += 1) {
          const key = localStorage.key(index);
          if (key && key.startsWith("noku-gantt-data") && !known.includes(key)) known.push(key);
        }
      } catch (error) {
        console.warn(error);
      }
      return known;
    }

    function dataScore(candidate) {
      if (!candidate || !Array.isArray(candidate.tasks)) return -1;
      const starterTaskNames = new Set(starterData.tasks.map((task) => task.name));
      const starterProjectNames = new Set(starterData.projects.map((project) => project.name));
      const starterMatches = candidate.tasks.filter((task) => starterTaskNames.has(task.name)).length;
      const projectMatches = (candidate.projects || []).filter((project) => starterProjectNames.has(project.name)).length;
      const looksStarter = starterMatches >= starterData.tasks.length - 1 && projectMatches >= starterData.projects.length - 1;
      const customTasks = candidate.tasks.filter((task) => !starterTaskNames.has(task.name)).length;
      return (candidate.tasks.length * 100) + ((candidate.projects || []).length * 20) + ((candidate.members || []).length * 10) + ((candidate.statuses || []).length * 10) + (customTasks * 250) + (looksStarter ? -500 : 500);
    }

    function dataCandidates() {
      const candidates = [];
      allDataKeys().forEach((key) => {
        try {
          const saved = JSON.parse(safeStorageGet(key));
          if (saved && Array.isArray(saved.tasks)) {
            candidates.push({ key, data: normalizeData(saved), score: dataScore(saved) });
          }
        } catch (error) {
          console.warn(error);
        }
      });
      return candidates.sort((a, b) => b.score - a.score);
    }

    function migrateLegacyData() {
      const best = dataCandidates()[0];
      if (!best) return null;
      const serialized = JSON.stringify(best.data);
      safeStorageSet(storageKey, serialized);
      safeStorageSet(stableStorageKey, serialized);
      return best.data;
    }

    function loadData() {
      try {
        const pending = JSON.parse(safeStorageGet(pendingSaveKey) || "null");
        if (pending?.data && Array.isArray(pending.data.tasks)) return normalizeData(pending.data);
      } catch (error) {
        console.warn(error);
      }
      try {
        const migrated = migrateLegacyData();
        if (migrated) return migrated;
      } catch (error) {
        console.warn(error);
      }
      return resetToStarterData();
    }

    function resetToStarterData() {
      const fresh = normalizeData(structuredClone(starterData));
      safeStorageSet(storageKey, JSON.stringify(fresh));
      safeStorageSet(stableStorageKey, JSON.stringify(fresh));
      return fresh;
    }

    function normalizeData(source) {
      const normalized = {
        projects: Array.isArray(source.projects) && source.projects.length ? source.projects.map(normalizeProject) : structuredClone(starterData.projects),
        members: Array.isArray(source.members) && source.members.length ? source.members.map(normalizeMember) : structuredClone(starterData.members),
        statuses: Array.isArray(source.statuses) && source.statuses.length ? source.statuses.map(normalizeStatus) : structuredClone(starterData.statuses),
        tasks: Array.isArray(source.tasks) ? source.tasks : [],
        ooo: Array.isArray(source.ooo) ? source.ooo : [],
        oooSettings: normalizeOooSettings(source.oooSettings)
      };
      normalized.tasks = normalized.tasks.map((task) => {
        const taskStatus = normalized.statuses.some((status) => status.name === task.status) ? task.status : normalized.statuses[0]?.name || "";
        const taskMembers = Array.isArray(task.members) && task.members.length
          ? task.members
          : (task.mirrorSource === otacosMirrorSource ? [] : (task.member ? [task.member] : [normalized.members[0]?.name].filter(Boolean)));
        return {
          ...task,
          id: task.id || `task-${Math.random().toString(16).slice(2)}`,
          name: task.name || "Nuovo task",
          projectId: normalized.projects.some((project) => project.id === task.projectId) ? task.projectId : normalized.projects[0]?.id || "",
          members: taskMembers,
          start: task.start || iso(today),
          end: task.hasEnd === false ? (task.start || iso(today)) : (task.end || task.start || iso(today)),
          hasEnd: task.hasEnd === true || Boolean(task.end && task.start && task.end !== task.start),
          status: taskStatus,
          done: Boolean(task.done) || isDoneStatus(taskStatus),
          notes: task.notes || "",
          subtasks: Array.isArray(task.subtasks) ? task.subtasks.map((subtask) => {
            let subtaskStart = subtask.start || "";
            let subtaskEnd = subtaskStart ? (subtask.end || subtaskStart) : "";
            if (subtaskStart && subtaskEnd && parseDate(subtaskEnd) < parseDate(subtaskStart)) [subtaskStart, subtaskEnd] = [subtaskEnd, subtaskStart];
            return {
              id: subtask.id || `sub-${Math.random().toString(16).slice(2)}`,
              title: subtask.title || subtask.name || "Sottotask",
              done: Boolean(subtask.done),
              members: Array.isArray(subtask.members) ? subtask.members : (subtask.member ? [subtask.member] : []),
              start: subtaskStart,
              end: subtaskEnd,
              hasEnd: Boolean(subtaskStart && subtaskEnd && subtaskEnd !== subtaskStart)
            };
          }) : []
        };
      });
      normalized.ooo = normalized.ooo.map((entry) => {
        const memberName = normalized.members.some((member) => member.name === entry.member) ? entry.member : normalized.members[0]?.name || "";
        const start = entry.start || iso(today);
        const end = entry.hasEnd === false ? start : (entry.end || start);
        return {
          ...entry,
          id: entry.id || `ooo-${Math.random().toString(16).slice(2)}`,
          member: memberName,
          start,
          end,
          hasEnd: entry.hasEnd === true || Boolean(end && start && end !== start)
        };
      }).filter((entry) => entry.member);
      return normalized;
    }

    function calendarText(value) {
      return String(value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, " ")
        .trim();
    }

    function excludedCalendarTitle(title) {
      const value = calendarText(title);
      return ["daily", "breakfast trend", "friday inspo", "the kolors"]
        .some((excluded) => value.includes(excluded));
    }

    function ensureCalendarMember(name) {
      const aliases = {
        "giorgio assenza": "Gio",
        "valentina viscomi": "Vale",
        "alessia lunardi": "Ale"
      };
      const wanted = aliases[calendarText(name)] || String(name || "").trim();
      let member = data.members.find((item) => sameName(item.name, wanted));
      if (member) return member;
      member = {
        name: wanted,
        color: colors[data.members.length % colors.length],
        textColor: "#111111"
      };
      data.members.push(member);
      return member;
    }

    function ensureCalendarFallbackProject() {
      let project = data.projects.find((item) => sameName(item.name, "CALL & APPUNTAMENTI"));
      if (project) return project;
      project = {
        id: "call-appuntamenti",
        name: "CALL & APPUNTAMENTI",
        color: "#c084fc",
        textColor: "#111111"
      };
      data.projects.push(project);
      return project;
    }

    function calendarProjectForTitle(title) {
      const normalizedTitle = calendarText(title);
      const aliases = {
        "o tacos": ["otacos", "o tacos"],
        "x factor": ["x factor", "xf"],
        "sky coppe": ["sky coppe", "coppe"]
      };
      const candidates = data.projects
        .filter((project) => project.id !== "call-appuntamenti")
        .map((project) => {
          const projectName = calendarText(project.name);
          const terms = [projectName, ...(aliases[projectName] || [])].filter(Boolean);
          const score = Math.max(...terms.map((term) => normalizedTitle.includes(term) ? term.length : 0), 0);
          return { project, score };
        })
        .filter((entry) => entry.score > 0)
        .sort((left, right) => right.score - left.score);
      return candidates[0]?.project || ensureCalendarFallbackProject();
    }

    function calendarDate(value) {
      return String(value || "").slice(0, 10);
    }

    function calendarSourceKey(event) {
      return `${event.eventId || event.id || calendarText(event.title)}|${event.start || event.startDate || ""}`;
    }

    function syncCalendarFeed(feed) {
      const events = Array.isArray(feed?.events) ? feed.events : [];
      const accepted = events.filter((event) =>
        event?.responseStatus === "accepted" &&
        !event.allDay &&
        !excludedCalendarTitle(event.title)
      );
      const grouped = new Map();
      accepted.forEach((event) => {
        const key = calendarSourceKey(event);
        const current = grouped.get(key) || { ...event, people: [] };
        current.people.push(event.person);
        grouped.set(key, current);
      });
      const existingTasks = new Map(data.tasks
        .filter((task) => task.mirrorSource === calendarMirrorSource)
        .map((task) => [task.sourceKey, task]));
      const status = data.statuses[0]?.name || "";
      const importedTasks = [...grouped.entries()].map(([sourceKey, event]) => {
        const existing = existingTasks.get(sourceKey);
        const members = [...new Set(event.people.filter(Boolean).map((person) => ensureCalendarMember(person).name))];
        const start = calendarDate(event.start);
        const end = calendarDate(event.end) || start;
        const project = existing?.manualProjectOverride
          ? data.projects.find((item) => item.id === existing.projectId) || calendarProjectForTitle(event.title)
          : calendarProjectForTitle(event.title);
        return {
          ...(existing || {}),
          id: existing?.id || `calendar:${pedHash(sourceKey)}`,
          mirrorSource: calendarMirrorSource,
          sourceKey,
          name: event.title || "Appuntamento",
          projectId: project.id,
          members: mirrorMembers(existing, members),
          manualMembersOverride: Boolean(existing?.manualMembersOverride),
          start,
          end,
          hasEnd: Boolean(end && start && end !== start),
          status: existing?.status || status,
          done: isDoneStatus(existing?.status || status),
          notes: existing?.notes || "",
          subtasks: existing?.subtasks || []
        };
      });

      const manualOoo = data.ooo.filter((entry) => entry.mirrorSource !== calendarMirrorSource);
      const existingCalendarOoo = new Map(data.ooo
        .filter((entry) => entry.mirrorSource === calendarMirrorSource)
        .map((entry) => [entry.sourceKey, entry]));
      const importedOoo = events
        .filter((event) => /^(assenza|fuori sede|out of office|ooo)$/i.test(String(event.title || "").trim()))
        .flatMap((event) => {
          const member = ensureCalendarMember(event.person).name;
          const start = calendarDate(event.start || event.startDate);
          const end = calendarDate(event.endInclusive || event.endDateInclusive || event.start || event.startDate);
          if (!member || !start) return [];
          const duplicate = manualOoo.some((entry) => sameName(entry.member, member) && entry.start === start && entry.end === end);
          if (duplicate) return [];
          const sourceKey = calendarSourceKey(event);
          const existing = existingCalendarOoo.get(sourceKey);
          return [{
            ...(existing || {}),
            id: existing?.id || `calendar-ooo:${pedHash(sourceKey)}`,
            mirrorSource: calendarMirrorSource,
            sourceKey,
            member,
            start,
            end,
            hasEnd: end !== start
          }];
        });
      const manualTasks = data.tasks.filter((task) => task.mirrorSource !== calendarMirrorSource);
      const retainedCalendarTasks = protectedMissingMirrorTasks(calendarMirrorSource, importedTasks);
      const nextData = normalizeData({
        ...data,
        tasks: [...manualTasks, ...importedTasks, ...retainedCalendarTasks],
        ooo: [...manualOoo, ...importedOoo]
      });
      if (dataSignature(nextData) !== dataSignature(data)) {
        saveBackup("Prima della sincronizzazione Calendar", data);
        data = nextData;
        saveData("Sincronizza Calendar");
        render();
      }
    }

    async function loadProtectedCalendarMirror(maxAttempts = 3) {
      if (!firebaseAuth?.currentUser) throw new Error("Login Firebase Calendar non disponibile");
      let lastError = null;
      for (let attempt = 0; attempt < maxAttempts; attempt += 1) {
        try {
          const idToken = await firebaseAuth.currentUser.getIdToken(attempt > 0);
          const response = await withTimeout(fetch(
            `https://firestore.googleapis.com/v1/projects/${FIREBASE_CONFIG.projectId}/databases/(default)/documents/boards/${remoteBoardId}-calendar?_=${Date.now()}`,
            { cache: "no-store", headers: { Authorization: `Bearer ${idToken}` } }
          ), 8000, "Lettura feed Calendar protetto non riuscita");
          if (!response.ok) throw new Error(`Feed Calendar protetto HTTP ${response.status}`);
          const document = await response.json();
          const calendarData = decodeFirestoreValue(document.fields?.data);
          if (!calendarData || !Array.isArray(calendarData.tasks)) {
            throw new Error("Feed Calendar protetto non valido");
          }
          lastCalendarRemoteData = calendarData;
          data = preserveRemoteCalendarMirror(data, calendarData);
          lastSavedData = cloneData(data);
          writeLocalSnapshot(data, history, dataRevision);
          render();
          return calendarData;
        } catch (error) {
          lastError = error;
          if (attempt + 1 < maxAttempts) {
            await new Promise((resolve) => window.setTimeout(resolve, 500 * (attempt + 1)));
          }
        }
      }
      throw lastError || new Error("Feed Calendar protetto non disponibile");
    }

    async function syncCalendarMirror() {
      if (calendarSyncPromise) return calendarSyncPromise;
      calendarSyncPromise = (async () => {
        try {
          if (firebaseAuth?.currentUser) {
            await loadProtectedCalendarMirror();
            return;
          }
          if (window.NOKU_CALENDAR_FEED?.events) {
            syncCalendarFeed(window.NOKU_CALENDAR_FEED);
            return;
          }
          const response = await fetch(`${calendarSyncUrl}?_=${Date.now()}`, { cache: "no-store" });
          if (!response.ok) throw new Error(`Feed Calendar non disponibile (${response.status})`);
          syncCalendarFeed(await response.json());
        } catch (error) {
          console.warn("Calendar mirror sync skipped", error);
        } finally {
          calendarSyncPromise = null;
        }
      })();
      return calendarSyncPromise;
    }

    function startCalendarSyncSchedule() {
      if (calendarSyncTimer) window.clearInterval(calendarSyncTimer);
      calendarSyncTimer = window.setInterval(() => syncCalendarMirror(), calendarSyncIntervalMs);
    }

    function normalizeProject(project, index = 0) {
      const fallback = starterData.projects[index % starterData.projects.length];
      const name = (typeof project === "string" ? project : project?.name || fallback.name).trim();
      return {
        id: project?.id || slug(name) || fallback.id,
        name: name || fallback.name,
        color: project?.color || fallback.color || colors[index % colors.length],
        textColor: project?.textColor || fallback.textColor || "#111111"
      };
    }

    function normalizeMember(member, index = 0) {
      if (typeof member === "string") return { name: member, color: colors[index % colors.length], textColor: "#111111" };
      return {
        name: member?.name || `Team ${index + 1}`,
        color: member?.color || colors[index % colors.length],
        textColor: member?.textColor || "#111111"
      };
    }

    function normalizeStatus(status, index = 0) {
      if (typeof status === "string") return { name: status, color: colors[index % colors.length], textColor: "#111111" };
      return {
        name: status?.name || starterData.statuses[index % starterData.statuses.length]?.name || `Status ${index + 1}`,
        color: status?.color || starterData.statuses[index % starterData.statuses.length]?.color || colors[index % colors.length],
        textColor: status?.textColor || starterData.statuses[index % starterData.statuses.length]?.textColor || "#111111"
      };
    }

    function normalizeOooSettings(settings = {}) {
      return {
        color: settings?.color || starterData.oooSettings.color,
        textColor: settings?.textColor || starterData.oooSettings.textColor
      };
    }

    function isDoneStatus(statusName) {
      return /^(done|fatto|fatti|fatta|fatte|completat[oaie]?|chius[oaie]?)$/i.test(String(statusName || "").trim());
    }

    function isBlockedStatus(statusName) {
      return /^(blocked|bloccato|bloccata|bloccati|bloccate|block)$/i.test(String(statusName || "").trim());
    }

    function isTaskDone(task) {
      return Boolean(task?.done) || isDoneStatus(task?.status);
    }

    function isCallTask(task) {
      if (!task) return false;
      if (task.mirrorSource === calendarMirrorSource) return true;
      if (task.projectId === "call-appuntamenti") return true;
      return /^call\b/i.test(String(task.name || "").trim());
    }

    function isTaskCountable(task) {
      return !isCallTask(task) && !isTaskDone(task) && !isBlockedStatus(task?.sourceStatus) && !isBlockedStatus(task?.status);
    }

    function isTaskActiveToday(task) {
      if (!task?.start) return false;
      const start = parseDate(task.start);
      const end = parseDate(task.end || task.start);
      return start <= today && end >= today;
    }

    function isTaskOverdue(task) {
      if (!task?.start) return false;
      const end = parseDate(task.end || task.start);
      return end < today && isTaskCountable(task);
    }

    function isTaskRelevantForMemberCount(task) {
      return isTaskCountable(task) && (isTaskActiveToday(task) || isTaskOverdue(task));
    }

    function overlapsDateRange(item, startRange, endRange) {
      if (!item?.start) return false;
      const start = parseDate(item.start);
      const end = parseDate(item.end || item.start);
      return start <= endRange && end >= startRange;
    }

    function isInMemberWindow(item) {
      const windowStart = addDays(today, -7);
      const windowEnd = addDays(today, 7);
      return overlapsDateRange(item, windowStart, windowEnd);
    }

    function safeStorageGet(key) {
      try {
        return localStorage.getItem(key);
      } catch (error) {
        console.warn(error);
        return null;
      }
    }

    function safeStorageSet(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch (error) {
        console.warn(error);
      }
    }

    function safeStorageRemove(key) {
      try {
        localStorage.removeItem(key);
      } catch (error) {
        console.warn(error);
      }
    }

    function cloneData(value) {
      return normalizeData(structuredClone(value));
    }

    function dataSignature(value) {
      return JSON.stringify(value);
    }

    function loadProtectedStatusOverrides() {
      try {
        const saved = JSON.parse(safeStorageGet(protectedStatusKey) || "{}");
        const cutoff = Date.now() - (7 * 24 * 60 * 60 * 1000);
        return Object.fromEntries(Object.entries(saved || {}).filter(([, entry]) => entry?.time >= cutoff));
      } catch (error) {
        console.warn(error);
        return {};
      }
    }

    function saveProtectedStatusOverrides(overrides) {
      safeStorageSet(protectedStatusKey, JSON.stringify(overrides || {}));
    }

    function loadDeletedTaskMarkers() {
      try {
        const saved = JSON.parse(safeStorageGet(deletedTaskKey) || "{}");
        const cutoff = Date.now() - (30 * 24 * 60 * 60 * 1000);
        return Object.fromEntries(Object.entries(saved || {}).filter(([, time]) => Number(time) >= cutoff));
      } catch (error) {
        console.warn(error);
        return {};
      }
    }

    function saveDeletedTaskMarkers(markers) {
      safeStorageSet(deletedTaskKey, JSON.stringify(markers || {}));
    }

    function markTaskDeleted(taskId) {
      if (!taskId) return;
      const markers = loadDeletedTaskMarkers();
      markers[taskId] = Date.now();
      saveDeletedTaskMarkers(markers);
    }

    function protectTaskStatus(task) {
      if (!task?.id) return;
      const overrides = loadProtectedStatusOverrides();
      overrides[task.id] = {
        status: task.status,
        done: Boolean(task.done) || isDoneStatus(task.status),
        manualStatusOverride: true,
        time: Date.now()
      };
      saveProtectedStatusOverrides(overrides);
    }

    function applyProtectedTaskStatuses(source) {
      const normalized = normalizeData(source);
      const overrides = loadProtectedStatusOverrides();
      let changed = false;
      normalized.tasks = normalized.tasks.map((task) => {
        const override = overrides[task.id];
        if (!override || !normalized.statuses.some((status) => status.name === override.status)) return task;
        const nextDone = Boolean(override.done) || isDoneStatus(override.status);
        if (task.status === override.status && Boolean(task.done) === nextDone && task.manualStatusOverride === true) return task;
        changed = true;
        return {
          ...task,
          status: override.status,
          done: nextDone,
          manualStatusOverride: true
        };
      });
      return { data: normalized, changed };
    }

    function protectedMissingMirrorTasks(mirrorSource, incomingTasks) {
      const incomingIds = new Set(incomingTasks.map((task) => task.id));
      const overrides = loadProtectedStatusOverrides();
      return data.tasks
        .filter((task) => task.mirrorSource === mirrorSource && !incomingIds.has(task.id))
        .filter((task) => overrides[task.id] || (task.manualStatusOverride && isTaskDone(task)))
        .map((task) => {
          const override = overrides[task.id];
          if (!override || !data.statuses.some((status) => status.name === override.status)) return task;
          return {
            ...task,
            status: override.status,
            done: Boolean(override.done) || isDoneStatus(override.status),
            manualStatusOverride: true
          };
        });
    }

    function loadHistory() {
      try {
        const saved = JSON.parse(safeStorageGet(historyKey));
        if (Array.isArray(saved)) {
          return saved.filter((entry) => entry?.snapshot).slice(0, 10);
        }
      } catch (error) {
        console.warn(error);
      }
      return [];
    }

    function loadBackups() {
      try {
        const saved = JSON.parse(safeStorageGet(backupKey));
        if (Array.isArray(saved)) {
          return saved.filter((entry) => entry?.snapshot).slice(0, 20);
        }
      } catch (error) {
        console.warn(error);
      }
      return [];
    }

    function saveBackup(label, snapshot) {
      if (!snapshot || !Array.isArray(snapshot.tasks)) return;
      const normalized = normalizeData(cloneData(snapshot));
      const backups = loadBackups();
      const signature = dataSignature(normalized);
      if (backups[0] && dataSignature(backups[0].snapshot) === signature) return;
      backups.unshift({
        id: `backup-${Date.now()}-${Math.random().toString(16).slice(2)}`,
        label,
        time: Date.now(),
        snapshot: normalized
      });
      safeStorageSet(backupKey, JSON.stringify(backups.slice(0, 20)));
    }

    function saveHistory() {
      safeStorageSet(historyKey, JSON.stringify(history.slice(0, 10)));
      updateUndoButton();
    }

    function updateUndoButton() {
      if (!undoBtn) return;
      undoBtn.disabled = !history.length;
      undoBtn.title = history.length ? `Annulla: ${history[0].label}` : "Nessuna operazione da annullare";
    }

    function setSyncMessage(message, isError = false) {
      if (!syncStatus) return;
      syncStatus.textContent = message;
      syncStatus.classList.toggle("is-error", Boolean(isError));
      syncStatus.title = isError ? `Salvataggio condiviso: ${message}` : `Salvataggio condiviso: ${message}`;
    }

    function cleanForRemote(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function writeLocalSnapshot(snapshotData = data, snapshotHistory = history, revision = dataRevision) {
      let normalized = applyProtectedTaskStatuses(snapshotData).data;
      if (pendingLocalSnapshot) {
        const pendingAge = Date.now() - Number(pendingLocalSnapshot.confirmedAt || pendingLocalSnapshot.savedAt || Date.now());
        const incomingSignature = dataSignature(normalized);
        const pendingSignature = dataSignature(applyProtectedTaskStatuses(pendingLocalSnapshot.data).data);
        if (pendingAge < 60 * 1000 && incomingSignature !== pendingSignature) {
          normalized = applyProtectedTaskStatuses(pendingLocalSnapshot.data).data;
          snapshotHistory = pendingLocalSnapshot.history || snapshotHistory;
          revision = Math.max(Number(revision || 0), Number(pendingLocalSnapshot.revision || 0));
        }
      }
      safeStorageSet(storageKey, JSON.stringify(normalized));
      safeStorageSet(stableStorageKey, JSON.stringify(normalized));
      safeStorageSet(historyKey, JSON.stringify((snapshotHistory || []).slice(0, 10)));
      safeStorageSet(revisionKey, String(revision || 0));
    }

    function loadPendingLocalSnapshot() {
      try {
        const payload = JSON.parse(safeStorageGet(pendingSaveKey) || "null");
        if (!payload?.data || !Array.isArray(payload.data.tasks)) return null;
        if (payload.confirmedAt && Date.now() - Number(payload.confirmedAt) > 60 * 1000) {
          localStorage.removeItem(pendingSaveKey);
          return null;
        }
        return {
          data: cleanForRemote(normalizeData(payload.data)),
          history: Array.isArray(payload.history) ? payload.history.slice(0, 10) : [],
          revision: Number(payload.revision || 0),
          savedAt: Number(payload.savedAt || Date.now()),
          confirmedAt: payload.confirmedAt ? Number(payload.confirmedAt) : 0
        };
      } catch (error) {
        console.warn(error);
        return null;
      }
    }

    function storePendingLocalSnapshot(snapshot) {
      if (!snapshot?.data) return;
      safeStorageSet(pendingSaveKey, JSON.stringify({
        ...snapshot,
        savedAt: snapshot.savedAt || Date.now()
      }));
    }

    function clearPendingLocalSnapshot(revision) {
      if (pendingLocalSnapshot && revision && pendingLocalSnapshot.revision !== revision) return;
      if (pendingLocalSnapshot) {
        const protectedUntil = Number(pendingLocalSnapshot.confirmedAt || pendingLocalSnapshot.savedAt || Date.now()) + 60 * 1000;
        if (Date.now() < protectedUntil) {
          storePendingLocalSnapshot(pendingLocalSnapshot);
          return;
        }
      }
      pendingLocalSnapshot = null;
      pendingRemoteSave = false;
      try {
        localStorage.removeItem(pendingSaveKey);
      } catch (error) {
        console.warn(error);
      }
    }

    function withTimeout(promise, milliseconds, label) {
      let timer;
      const timeout = new Promise((_, reject) => {
        timer = window.setTimeout(() => reject(new Error(label || "Timeout")), milliseconds);
      });
      return Promise.race([promise, timeout]).finally(() => window.clearTimeout(timer));
    }

    function sameName(left, right) {
      return String(left || "").trim().toLowerCase() === String(right || "").trim().toLowerCase();
    }

    function sameMembers(left = [], right = []) {
      const clean = (items) => [...new Set((Array.isArray(items) ? items : [items])
        .filter(Boolean)
        .map((item) => String(item).trim().toLowerCase()))].sort();
      return JSON.stringify(clean(left)) === JSON.stringify(clean(right));
    }

    function mirrorMembers(existingTask, sourceMembers = []) {
      if (existingTask?.manualMembersOverride) return Array.isArray(existingTask.members) ? existingTask.members : [];
      return Array.isArray(sourceMembers) ? sourceMembers : [];
    }

    function otacosProject() {
      let project = data.projects.find((item) => sameName(item.name, "O'Tacos") || sameName(item.name, "O’Tacos") || sameName(item.name, "OTacos") || sameName(item.name, "O TACOS"));
      if (!project) {
        project = { id: "otacos", name: "O'Tacos", color: "#ff6b00", textColor: "#111111" };
        data.projects = [project, ...data.projects];
      }
      return project;
    }

    function matchingMemberNames(sourceMembers = []) {
      const sourceList = Array.isArray(sourceMembers) ? sourceMembers : [sourceMembers].filter(Boolean);
      const translated = sourceList.map((name) => {
        const source = String(name || "").trim().toLowerCase();
        if (source === "giorgio") return "Gio";
        if (source === "alessia") return "Ale";
        if (source === "vale v" || source === "valev" || source === "valentina v") return "Vale";
        return name;
      });
      return data.members
        .filter((member) => translated.some((name) => sameName(name, member.name)))
        .map((member) => member.name);
    }

    function findStatusByNames(names = []) {
      return data.statuses.find((status) => names.some((name) => sameName(status.name, name)));
    }

    function matchingStatusName(sourceStatus, existingStatus = "") {
      const source = String(sourceStatus || "").trim().toLowerCase();
      const wanted = source === "to do" || source === "todo"
        ? ["To do", "Todo", "Backlog"]
        : source === "blocked" || source === "bloccato"
          ? ["Bloccato", "Blocked"]
          : source === "done" || source === "fatto"
            ? ["Fatto", "Done", "Live"]
            : ["In progress", "In corso", "Progress", "Review"];
      const mapped = findStatusByNames(wanted);
      if (mapped) return mapped.name;
      const exact = data.statuses.find((status) => sameName(status.name, sourceStatus));
      if (exact) return exact.name;
      if (existingStatus && data.statuses.some((status) => status.name === existingStatus)) return existingStatus;
      return data.statuses[0]?.name || "";
    }

    function mirrorTaskId(sourceTaskId) {
      return `${otacosMirrorSource}:${sourceTaskId}`;
    }

    function otacosTaskDisplayName(task, otacosProjects = []) {
      const taskName = task.nameEn || task.name || "Task O'Tacos";
      const sourceProject = otacosProjects.find((project) => project?.id === task.projectId);
      const projectName = sourceProject?.name || "";
      if (!projectName) return taskName;
      if (taskName.toLowerCase().startsWith(`${projectName.toLowerCase()} - `)) return taskName;
      return `${projectName} - ${taskName}`;
    }

    function syncOtacosMirror(remoteData) {
      if (remoteData) lastOtacosRemoteData = remoteData;
      const sourceTasks = Array.isArray(remoteData?.tasks) ? remoteData.tasks : [];
      const sourceProjects = Array.isArray(remoteData?.projects) ? remoteData.projects : [];
      const project = otacosProject();
      const sourceIds = new Set();
      const existingMirrorBySource = new Map(data.tasks
        .filter((task) => task.mirrorSource === otacosMirrorSource)
        .map((task) => [task.sourceTaskId, task]));
      const mirrorTasks = sourceTasks
        .filter((task) => task?.id && !task.creatorParentId)
        .map((task) => {
          sourceIds.add(task.id);
          const existing = existingMirrorBySource.get(task.id);
          const start = task.start || task.date || iso(today);
          const end = task.end || start;
          const members = matchingMemberNames(task.members || task.member || []);
          const sourceStatus = String(task.status || "").trim();
          const keepManualStatus = Boolean(existing?.manualStatusOverride && existing?.sourceStatus === sourceStatus && data.statuses.some((status) => status.name === existing.status));
          const status = keepManualStatus ? existing.status : matchingStatusName(sourceStatus, existing?.status);
          return {
            ...(existing || {}),
            id: mirrorTaskId(task.id),
            mirrorSource: otacosMirrorSource,
            sourceTaskId: task.id,
            sourceStatus,
            manualStatusOverride: keepManualStatus,
            name: otacosTaskDisplayName(task, sourceProjects),
            projectId: project.id,
            members: mirrorMembers(existing, members),
            manualMembersOverride: Boolean(existing?.manualMembersOverride),
            start,
            end,
            hasEnd: Boolean(end && start && end !== start),
            status,
            done: isDoneStatus(sourceStatus) || isDoneStatus(status),
            notes: task.info || task.notes || existing?.notes || "",
            subtasks: []
          };
        });
      const retainedMirrorTasks = protectedMissingMirrorTasks(otacosMirrorSource, mirrorTasks);
      const manualTasks = data.tasks.filter((task) => task.mirrorSource !== otacosMirrorSource);
      data.tasks = [...manualTasks, ...mirrorTasks, ...retainedMirrorTasks];
      data = applyProtectedTaskStatuses(data).data;
      lastSavedData = cloneData(data);
      writeLocalSnapshot(data, history, dataRevision);
      render();
      if (startupAutoScroll) scheduleScrollToToday();
    }

    async function loadOtacosMirrorOnce() {
      if (!otacosBoardRef || !remoteApi?.getDoc) return;
      try {
        const snapshot = await withTimeout(remoteApi.getDoc(otacosBoardRef), 8000, "Lettura O'Tacos non riuscita");
        if (!snapshot.exists()) return;
        const otacosData = snapshot.data()?.data;
        if (!otacosData || !Array.isArray(otacosData.tasks)) return;
        syncOtacosMirror(otacosData);
      } catch (error) {
        console.error("O'Tacos mirror initial load failed", error);
      }
    }

    function pedCellText(cell) {
      if (!cell) return "";
      if (cell.f !== undefined && cell.f !== null) return String(cell.f).trim();
      if (cell.v === undefined || cell.v === null) return "";
      return String(cell.v).trim();
    }

    function parsePedDate(cell) {
      const rawValue = cell?.v;
      const serializedDate = typeof rawValue === "string"
        ? rawValue.match(/^Date\((\d{4}),(\d{1,2}),(\d{1,2})/)
        : null;
      if (serializedDate) {
        return iso(new Date(Number(serializedDate[1]), Number(serializedDate[2]), Number(serializedDate[3])));
      }
      const raw = pedCellText(cell).toLowerCase().replace(/\s+/g, " ").trim();
      const match = raw.match(/^(\d{1,2})\s+([a-zà]+)\s+(\d{4})$/i);
      if (!match) return "";
      const months = {
        gennaio: 0, febbraio: 1, marzo: 2, aprile: 3, maggio: 4, giugno: 5,
        luglio: 6, agosto: 7, settembre: 8, ottobre: 9, novembre: 10, dicembre: 11
      };
      const month = months[match[2]];
      if (month === undefined) return "";
      const parsed = new Date(Number(match[3]), month, Number(match[1]));
      return Number.isNaN(parsed.getTime()) ? "" : iso(parsed);
    }

    function pedHash(value) {
      let hash = 2166136261;
      for (let index = 0; index < value.length; index += 1) {
        hash ^= value.charCodeAt(index);
        hash = Math.imul(hash, 16777619);
      }
      return (hash >>> 0).toString(36);
    }

    function loadPedSheet(sheetName) {
      return new Promise((resolve, reject) => {
        const callbackName = `__nokuPed_${Date.now()}_${Math.random().toString(16).slice(2)}`;
        const script = document.createElement("script");
        const cleanup = () => {
          window.clearTimeout(timer);
          script.remove();
          try {
            delete window[callbackName];
          } catch (error) {
            window[callbackName] = undefined;
          }
        };
        const timer = window.setTimeout(() => {
          cleanup();
          reject(new Error(`Timeout PED ${sheetName}`));
        }, 15000);
        window[callbackName] = (response) => {
          cleanup();
          if (response?.status === "error" || !response?.table) {
            reject(new Error(`Dati PED ${sheetName} non disponibili`));
            return;
          }
          resolve(response.table);
        };
        script.onerror = () => {
          cleanup();
          reject(new Error(`Connessione PED ${sheetName} non riuscita`));
        };
        const tqx = encodeURIComponent(`out:json;responseHandler:${callbackName}`);
        script.src = `https://docs.google.com/spreadsheets/d/${pedSpreadsheetId}/gviz/tq?tqx=${tqx}&sheet=${encodeURIComponent(sheetName)}&headers=1&_=${Date.now()}`;
        document.head.appendChild(script);
      });
    }

    function pedItemsFromTable(sheetName, table) {
      const columns = Array.isArray(table?.cols) ? table.cols : [];
      let dateIndex = columns.findIndex((column) => sameName(column?.label, "DATA"));
      let titleIndex = columns.findIndex((column) => sameName(column?.label, "TITOLO/CONTENUTO"));
      let rows = Array.isArray(table?.rows) ? table.rows : [];
      if (dateIndex < 0 || titleIndex < 0) {
        const headerRowIndex = rows.slice(0, 5).findIndex((row) => {
          const values = (row?.c || []).map(pedCellText);
          return values.some((value) => sameName(value, "TITOLO/CONTENUTO"));
        });
        if (headerRowIndex >= 0) {
          const headerValues = (rows[headerRowIndex]?.c || []).map(pedCellText);
          const detectedDateIndex = headerValues.findIndex((value) => sameName(value, "DATA"));
          const detectedTitleIndex = headerValues.findIndex((value) => sameName(value, "TITOLO/CONTENUTO"));
          if (detectedDateIndex >= 0) dateIndex = detectedDateIndex;
          if (detectedTitleIndex >= 0) titleIndex = detectedTitleIndex;
          if (dateIndex < 0) dateIndex = columns.findIndex((column) => sameName(column?.id, "A"));
          rows = rows.slice(headerRowIndex + 1);
        }
      }
      if (dateIndex < 0 || titleIndex < 0) {
        throw new Error(`Colonne DATA/TITOLO mancanti nel tab ${sheetName}`);
      }
      let currentDate = "";
      const occurrences = new Map();
      return rows.flatMap((row) => {
        const parsedDate = parsePedDate(row?.c?.[dateIndex]);
        if (parsedDate) currentDate = parsedDate;
        const title = pedCellText(row?.c?.[titleIndex]).replace(/\s+/g, " ").trim();
        if (!currentDate || !title) return [];
        const baseKey = `${sheetName}|${currentDate}|${title.toLowerCase()}`;
        const occurrence = (occurrences.get(baseKey) || 0) + 1;
        occurrences.set(baseKey, occurrence);
        return [{
          sourceKey: `${baseKey}|${occurrence}`,
          sourceSheet: sheetName,
          date: currentDate,
          title
        }];
      });
    }

    function ensurePedProject(sheetName) {
      let project = data.projects.find((item) => sameName(item.name, sheetName));
      if (project) return project;
      const projectColors = { PP: "#d9ff00", AF: "#00e0ff", MF: "#ff4f9a" };
      project = {
        id: `ped-${sheetName.toLowerCase()}`,
        name: sheetName,
        color: projectColors[sheetName] || colors[data.projects.length % colors.length],
        textColor: "#111111"
      };
      data.projects.push(project);
      return project;
    }

    function ensurePedMember(memberName) {
      let member = data.members.find((item) => sameName(item.name, memberName));
      if (member) return member;
      const memberColors = { Gio: "#d9ff00", Vale: "#00e0ff" };
      member = {
        name: memberName,
        color: memberColors[memberName] || colors[data.members.length % colors.length],
        textColor: "#111111"
      };
      data.members.push(member);
      return member;
    }

    function ensurePedDoneStatus() {
      let status = findStatusByNames(["Fatto", "Done", "Completato", "Completata", "Chiuso", "Chiusa"]);
      if (status) return status;
      status = { name: "Fatto", color: "#34d399", textColor: "#111111" };
      data.statuses.push(status);
      return status;
    }

    async function syncPedMirror() {
      if (pedSyncPromise) return pedSyncPromise;
      pedSyncPromise = (async () => {
        try {
          const tables = await Promise.all(pedSheetNames.map(async (sheetName) => ({
            sheetName,
            table: await loadPedSheet(sheetName)
          })));
          const itemsBySheet = tables.map(({ sheetName, table }) => ({
            sheetName,
            items: pedItemsFromTable(sheetName, table)
          }));
          if (itemsBySheet.some(({ items }) => !items.length)) {
            throw new Error("Uno o più tab PED risultano vuoti: sincronizzazione annullata");
          }
          const existingPedTasks = new Map(data.tasks
            .filter((task) => task.mirrorSource === pedMirrorSource)
            .map((task) => [task.sourceKey, task]));
          const mirrorTasks = itemsBySheet.flatMap(({ sheetName, items }) => {
            const project = ensurePedProject(sheetName);
            const assignedMember = ensurePedMember(sheetName === "MF" ? "Vale" : "Gio");
            const doneStatus = ensurePedDoneStatus();
            return items.map((item) => {
              const existing = existingPedTasks.get(item.sourceKey);
              const isPastPublication = parseDate(item.date) < today;
              const keepManualStatus = Boolean(existing?.manualStatusOverride && existing?.status && data.statuses.some((entry) => entry.name === existing.status));
              const status = keepManualStatus
                ? existing.status
                : isPastPublication
                  ? doneStatus.name
                  : existing?.status && data.statuses.some((entry) => entry.name === existing.status)
                    ? existing.status
                    : data.statuses[0]?.name || "";
              return {
                ...(existing || {}),
                id: existing?.id || `ped:${pedHash(item.sourceKey)}`,
                mirrorSource: pedMirrorSource,
                sourceSheet: sheetName,
                sourceKey: item.sourceKey,
                manualStatusOverride: keepManualStatus || Boolean(existing?.manualStatusOverride),
                name: `📅 PUBBLICARE ${item.title}`,
                projectId: project.id,
                members: mirrorMembers(existing, [assignedMember.name]),
                manualMembersOverride: Boolean(existing?.manualMembersOverride),
                start: item.date,
                end: item.date,
                hasEnd: false,
                status,
                done: isDoneStatus(status),
                notes: "",
                subtasks: []
              };
            });
          });
          const retainedPedTasks = protectedMissingMirrorTasks(pedMirrorSource, mirrorTasks);
          const manualTasks = data.tasks.filter((task) => task.mirrorSource !== pedMirrorSource);
          const nextData = applyProtectedTaskStatuses({ ...data, tasks: [...manualTasks, ...mirrorTasks, ...retainedPedTasks] }).data;
          if (dataSignature(nextData) !== dataSignature(data)) {
            saveBackup("Prima della sincronizzazione PED", data);
            data = nextData;
            saveData("Sincronizza PED");
            render();
          }
          setSyncMessage(remoteReady ? "Online · PED" : "Locale · PED");
        } catch (error) {
          console.error("PED mirror sync failed", error);
          setSyncMessage(remoteReady ? "Online · errore PED" : "Errore PED", true);
        } finally {
          pedSyncPromise = null;
        }
      })();
      return pedSyncPromise;
    }

    function startPedSyncSchedule() {
      if (pedSyncTimer) window.clearInterval(pedSyncTimer);
      pedSyncTimer = window.setInterval(() => syncPedMirror(), pedSyncIntervalMs);
    }

    function pushHistory(label) {
      const before = cloneData(lastSavedData);
      if (dataSignature(before) === dataSignature(data)) return;
      const now = Date.now();
      const last = history[0];
      if (label === "Modifica setup" && last && last.label === label && now - last.time < 1500) {
        saveHistory();
        return;
      }
      history.unshift({
        id: `hist-${now}-${Math.random().toString(16).slice(2)}`,
        label,
        time: now,
        snapshot: before
      });
      history = history.slice(0, 10);
      saveHistory();
    }

    async function startRemoteSync() {
      setSyncMessage("Connessione...");
      try {
        const [{ initializeApp }, { getAuth, signInAnonymously }, firestore] = await withTimeout(Promise.all([
          import("https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js"),
          import("https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js"),
          import("https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js")
        ]), 8000, "Firebase non raggiungibile");
        const { doc, getDoc, getFirestore, onSnapshot, serverTimestamp, setDoc } = firestore;
        remoteApi = { getDoc, serverTimestamp, setDoc };
        const app = initializeApp(FIREBASE_CONFIG);
        const auth = getAuth(app);
        await withTimeout(signInAnonymously(auth), 8000, "Login Firebase non riuscito");
        firebaseAuth = auth;
        const db = getFirestore(app);
        boardRef = doc(db, "boards", remoteBoardId);
        calendarBoardRef = doc(db, "boards", `${remoteBoardId}-calendar`);
        otacosBoardRef = doc(db, "boards", otacosBoardId);
        const snapshot = await withTimeout(getDoc(boardRef), 8000, "Lettura Firebase non riuscita");
        if (!snapshot.exists()) {
          dataRevision = Math.max(Date.now(), dataRevision + 1);
          await remoteApi.setDoc(boardRef, {
            data: cleanForRemote(compactDataForRemote(data)),
            history: cleanForRemote(compactHistoryForRemote(history)),
            revision: dataRevision,
            updatedAt: remoteApi.serverTimestamp()
          });
          writeLocalSnapshot(data, history, dataRevision);
          scheduleScrollToToday();
        } else {
          const remoteRevision = Number(snapshot.data()?.revision || 0);
          const pendingRevision = Number(pendingLocalSnapshot?.revision || 0);
          const localRevision = Math.max(dataRevision, pendingRevision);
          if (shouldPreferRemoteOnBoot && remoteRevision > 0) {
            pendingLocalSnapshot = null;
            pendingRemoteSave = false;
            try {
              localStorage.removeItem(pendingSaveKey);
              safeStorageSet(revisionKey, "0");
            } catch (error) {
              console.warn(error);
            }
            applyRemoteDocument(snapshot.data(), true);
          } else if (remoteRevision > localRevision) {
            // Una sincronizzazione esterna (Calendar) più recente deve vincere
            // anche su un vecchio salvataggio locale rimasto in sospeso.
            pendingLocalSnapshot = null;
            pendingRemoteSave = false;
            try {
              localStorage.removeItem(pendingSaveKey);
            } catch (error) {
              console.warn(error);
            }
            applyRemoteDocument(snapshot.data(), true);
          } else if (!pendingRemoteSave && dataRevision > remoteRevision) {
              pendingRemoteSave = true;
              pendingLocalSnapshot = {
                data: cleanForRemote(normalizeData(data)),
                history: cleanForRemote(history.slice(0, 10)),
                revision: dataRevision
              };
              storePendingLocalSnapshot(pendingLocalSnapshot);
          }
        }
        // Il mirror Calendar e' una sorgente indipendente e protetta. Caricalo
        // esplicitamente all'avvio: il listener resta utile per gli aggiornamenti,
        // ma non deve essere l'unico modo con cui le call arrivano a schermo.
        try {
          await loadProtectedCalendarMirror();
        } catch (calendarError) {
          console.error("Calendar board initial load failed", calendarError);
        }
        await loadOtacosMirrorOnce();
        unsubscribeBoard = onSnapshot(boardRef, (remoteSnapshot) => {
          if (!remoteSnapshot.exists() || applyingRemoteUpdate) return;
          applyRemoteDocument(remoteSnapshot.data(), false);
        }, (error) => {
          console.error("Firestore snapshot failed", error);
          setSyncMessage("Errore online", true);
        });
        unsubscribeCalendarBoard = onSnapshot(calendarBoardRef, (remoteSnapshot) => {
          if (!remoteSnapshot.exists()) return;
          const calendarData = remoteSnapshot.data()?.data;
          if (!calendarData || !Array.isArray(calendarData.tasks)) return;
          lastCalendarRemoteData = calendarData;
          data = preserveRemoteCalendarMirror(data, calendarData);
          lastSavedData = cloneData(data);
          writeLocalSnapshot(data, history, dataRevision);
          render();
        }, (error) => {
          console.error("Calendar board snapshot failed", error);
        });
        unsubscribeOtacosBoard = onSnapshot(otacosBoardRef, (remoteSnapshot) => {
          if (!remoteSnapshot.exists()) return;
          syncOtacosMirror(remoteSnapshot.data()?.data);
        }, (error) => {
          console.error("O'Tacos mirror snapshot failed", error);
        });
        remoteReady = true;
        setSyncMessage("Online");
        if (pendingRemoteSave) {
          pendingRemoteSave = false;
          queueRemoteSave("Sincronizza modifiche locali", pendingLocalSnapshot);
        }
      } catch (error) {
        console.error("Firebase load failed", error);
        remoteReady = false;
        setSyncMessage("Solo locale", true);
      }
    }

    function applyRemoteDocument(remoteDoc, force = false) {
      const remoteRevision = Number(remoteDoc?.revision || 0);
      const remoteData = remoteDoc?.data;
      if (!remoteData || !Array.isArray(remoteData.tasks)) return;
      if (pendingLocalSnapshot) {
        if (remoteRevision > Number(pendingLocalSnapshot.revision || 0)) {
          // Calendar usa una revisione protetta: se è più recente deve
          // aggiornare anche le schede già aperte, senza restare bloccato da
          // un vecchio salvataggio locale in sospeso.
          pendingLocalSnapshot = null;
          pendingRemoteSave = false;
          try {
            localStorage.removeItem(pendingSaveKey);
          } catch (error) {
            console.warn(error);
          }
        } else {
          const remoteSignature = dataSignature(normalizeData(remoteData));
          const pendingSignature = dataSignature(normalizeData(pendingLocalSnapshot.data));
          if (remoteRevision >= pendingLocalSnapshot.revision && remoteSignature === pendingSignature) {
          if (!pendingLocalSnapshot.confirmedAt) {
            pendingLocalSnapshot.confirmedAt = Date.now();
            storePendingLocalSnapshot(pendingLocalSnapshot);
          }
          if (Date.now() - pendingLocalSnapshot.confirmedAt > 60 * 1000) {
            clearPendingLocalSnapshot(pendingLocalSnapshot.revision);
          }
          } else if (!force) {
            return;
          }
        }
      }
      if (!force && applyingRemoteUpdate) return;
      if (!force && remoteRevision <= dataRevision) return;
      const protectedRemote = applyProtectedTaskStatuses(remoteData);
      data = protectedRemote.data;
      if (lastCalendarRemoteData) {
        data = preserveRemoteCalendarMirror(data, lastCalendarRemoteData);
      }
      history = Array.isArray(remoteDoc.history) ? remoteDoc.history.slice(0, 10) : history;
      dataRevision = remoteRevision;
      lastSavedData = cloneData(data);
      writeLocalSnapshot(data, history, dataRevision);
      saveBackup("Aggiornamento online", data);
      if (lastOtacosRemoteData) {
        syncOtacosMirror(lastOtacosRemoteData);
      } else {
        render();
      }
      if (force) scheduleScrollToToday();
      setSyncMessage("Online");
      if (protectedRemote.changed) queueRemoteSave("Proteggi status task");
    }

    function preserveRemoteCalendarMirror(localData, remoteData) {
      const local = normalizeData(localData);
      const remote = normalizeData(remoteData);
      const localCalendarByKey = new Map(local.tasks
        .filter((task) => task.mirrorSource === calendarMirrorSource)
        .flatMap((task) => [[task.id, task], [task.sourceKey, task]].filter(([key]) => key)));
      const remoteCalendarTasks = remote.tasks
        .filter((task) => task.mirrorSource === calendarMirrorSource)
        .map((task) => {
          const localTask = localCalendarByKey.get(task.id) || localCalendarByKey.get(task.sourceKey);
          if (!localTask?.manualMembersOverride) return task;
          return {
            ...task,
            members: Array.isArray(localTask.members) ? localTask.members : [],
            manualMembersOverride: true
          };
        });
      const calendarProjectIds = new Set(remoteCalendarTasks.map((task) => task.projectId).filter(Boolean));
      const localProjectIds = new Set(local.projects.map((project) => project.id));
      return normalizeData({
        ...local,
        projects: [
          ...local.projects,
          ...remote.projects.filter((project) =>
            calendarProjectIds.has(project.id) && !localProjectIds.has(project.id)
          )
        ],
        tasks: [
          ...local.tasks.filter((task) => task.mirrorSource !== calendarMirrorSource),
          ...remoteCalendarTasks
        ],
        ooo: [
          ...local.ooo.filter((entry) => entry.mirrorSource !== calendarMirrorSource),
          ...remote.ooo.filter((entry) => entry.mirrorSource === calendarMirrorSource)
        ]
      });
    }

    function mergeUniqueByKey(localItems, remoteItems, keyFn, shouldKeepRemote = () => true) {
      const seen = new Set(localItems.map(keyFn).filter(Boolean));
      return [
        ...localItems,
        ...remoteItems.filter((item) => {
          const key = keyFn(item);
          if (!key || seen.has(key) || !shouldKeepRemote(item)) return false;
          seen.add(key);
          return true;
        })
      ];
    }

    function mergeSharedDataForSave(localData, remoteData) {
      const local = normalizeData(localData);
      const remote = normalizeData(remoteData || {});
      const deletedTasks = loadDeletedTaskMarkers();
      const localTaskIds = new Set(local.tasks.map((task) => task.id));
      const merged = normalizeData({
        ...local,
        projects: mergeUniqueByKey(local.projects, remote.projects, (project) => project.id),
        members: mergeUniqueByKey(local.members, remote.members, (member) => member.name),
        statuses: mergeUniqueByKey(local.statuses, remote.statuses, (status) => status.name),
        tasks: [
          ...local.tasks,
          ...remote.tasks.filter((task) => !localTaskIds.has(task.id) && !deletedTasks[task.id])
        ],
        ooo: mergeUniqueByKey(local.ooo, remote.ooo, (entry) => entry.id, (entry) => !deletedTasks[entry.id])
      });
      return preserveRemoteCalendarMirror(applyProtectedTaskStatuses(merged).data, remote);
    }

    function shouldKeepMirrorTaskInRemote(task) {
      if (!task?.mirrorSource) return true;
      return Boolean(
        task.manualStatusOverride ||
        task.manualMembersOverride ||
        task.manualProjectOverride ||
        (Array.isArray(task.subtasks) && task.subtasks.length) ||
        task.notes
      );
    }

    function compactTaskForRemote(task) {
      if (!task?.mirrorSource || shouldKeepMirrorTaskInRemote(task)) return task;
      return null;
    }

    function compactDataForRemote(sourceData) {
      const normalized = normalizeData(sourceData);
      return {
        ...normalized,
        tasks: normalized.tasks
          .map(compactTaskForRemote)
          .filter(Boolean)
      };
    }

    function compactHistoryForRemote(sourceHistory = []) {
      return sourceHistory.slice(0, 10).map((entry) => ({
        ...entry,
        snapshot: entry?.snapshot ? compactDataForRemote(entry.snapshot) : entry?.snapshot
      }));
    }

    function decodeFirestoreValue(value = {}) {
      if (Object.prototype.hasOwnProperty.call(value, "stringValue")) return value.stringValue;
      if (Object.prototype.hasOwnProperty.call(value, "integerValue")) return Number(value.integerValue);
      if (Object.prototype.hasOwnProperty.call(value, "doubleValue")) return Number(value.doubleValue);
      if (Object.prototype.hasOwnProperty.call(value, "booleanValue")) return value.booleanValue;
      if (Object.prototype.hasOwnProperty.call(value, "nullValue")) return null;
      if (Object.prototype.hasOwnProperty.call(value, "timestampValue")) return value.timestampValue;
      if (value.arrayValue) return (value.arrayValue.values || []).map(decodeFirestoreValue);
      if (value.mapValue) {
        return Object.fromEntries(Object.entries(value.mapValue.fields || {}).map(
          ([key, item]) => [key, decodeFirestoreValue(item)]
        ));
      }
      return null;
    }

    function queueRemoteSave(label = "Modifica", forcedSnapshot = null) {
      const protectedPending = pendingLocalSnapshot && !forcedSnapshot && /^Sincronizza/.test(label);
      const sourceSnapshot = forcedSnapshot || (protectedPending ? pendingLocalSnapshot : null);
      let snapshotData = cleanForRemote(applyProtectedTaskStatuses(sourceSnapshot?.data || data).data);
      const snapshotHistory = sourceSnapshot?.history || cleanForRemote(history.slice(0, 10));
      const nextRevision = sourceSnapshot?.revision || Math.max(Date.now(), dataRevision + 1);
      dataRevision = Math.max(dataRevision, nextRevision);
      pendingLocalSnapshot = {
        data: snapshotData,
        history: snapshotHistory,
        revision: nextRevision,
        savedAt: sourceSnapshot?.savedAt || Date.now(),
        confirmedAt: sourceSnapshot?.confirmedAt || 0
      };
      storePendingLocalSnapshot(pendingLocalSnapshot);
      writeLocalSnapshot(snapshotData, snapshotHistory, dataRevision);
      if (!boardRef || !remoteReady || !remoteApi) {
        pendingRemoteSave = true;
        setSyncMessage("In attesa", true);
        return;
      }
      saveQueue = saveQueue.catch(() => {}).then(async () => {
        try {
          setSyncMessage("Salvataggio...");
          applyingRemoteUpdate = true;
          const latestSnapshot = await remoteApi.getDoc(boardRef);
          if (latestSnapshot.exists()) {
            const mergedSnapshotData = cleanForRemote(mergeSharedDataForSave(
              snapshotData,
              latestSnapshot.data()?.data
            ));
            if (dataSignature(mergedSnapshotData) !== dataSignature(snapshotData)) {
              snapshotData = mergedSnapshotData;
              pendingLocalSnapshot.data = snapshotData;
              data = normalizeData(snapshotData);
              lastSavedData = cloneData(data);
              storePendingLocalSnapshot(pendingLocalSnapshot);
              writeLocalSnapshot(data, snapshotHistory, nextRevision);
              render();
            }
          }
          await remoteApi.setDoc(boardRef, {
            data: cleanForRemote(compactDataForRemote(snapshotData)),
            history: cleanForRemote(compactHistoryForRemote(snapshotHistory)),
            revision: nextRevision,
            updatedAt: remoteApi.serverTimestamp()
          }, { merge: true });
          applyingRemoteUpdate = false;
          pendingRemoteSave = false;
          setSyncMessage("Online");
        } catch (error) {
          applyingRemoteUpdate = false;
          pendingRemoteSave = true;
          console.error("Firestore save failed", error);
          setSyncMessage("Errore save", true);
        }
      });
    }

    function saveData(label = "Modifica") {
      saveBackup(`Prima di ${label}`, lastSavedData);
      pushHistory(label);
      writeLocalSnapshot(data, history, dataRevision);
      saveBackup(label, data);
      lastSavedData = cloneData(data);
      queueRemoteSave(label);
    }

    function saveAndRefresh(options = {}) {
      saveData();
      render();
      if (options.settings === false) return;
    }

    let pendingSetupPreviewFrame = 0;

    function isSetupColorInput(target) {
      return Boolean(target.closest([
        "[data-project-color]",
        "[data-project-text-color]",
        "[data-ooo-color]",
        "[data-ooo-text-color]",
        "[data-member-color]",
        "[data-member-text-color]",
        "[data-status-color]",
        "[data-status-text-color]"
      ].join(",")));
    }

    function previewSetupColors(scope = "all") {
      if (pendingSetupPreviewFrame) return;
      pendingSetupPreviewFrame = requestAnimationFrame(() => {
        pendingSetupPreviewFrame = 0;
        if (scope === "rows") {

    function formatHistoryTime(time) {
      return new Date(time).toLocaleString("it-IT", {
        day: "2-digit",
        month: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      });

    function renderHistory() {
      updateUndoButton();
      if (!historyList) return;
      const backups = loadBackups();
      const storedVersions = dataCandidates();
      const historyHtml = history.length ? history.map((entry, index) => `
        <div class="history-row">
          <div>

      `).join("") : `<div class="history-row"><div><strong>Nessuna modifica precedente</strong><span>Da ora in poi le modifiche verranno archiviate automaticamente.</span></div></div>`;
      const backupHtml = backups.length ? backups.map((entry, index) => `
        <div class="history-row">
          <div>
            <strong>Backup · ${escapeHtml(entry.label)}</strong>
            <span>${formatHistoryTime(entry.time)} · ${entry.snapshot.tasks.length} task · ${entry.snapshot.projects.length} progetti</span>
          </div>
          <button class="text-btn" type="button" data-restore-backup="${index}">Ripristina</button>
        </div>
      `).join("") : "";
      const storedHtml = storedVersions.map((entry) => `
        <div class="history-row">
          <div>
            <strong>Archivio browser · ${escapeHtml(entry.key)}</strong>

      historyList.innerHTML = `
