  <script>
    (() => {
      const appVersion = "v110";
      window.NOKU_APP_VERSION = appVersion;
      if ("scrollRestoration" in window.history) {
        window.history.scrollRestoration = "manual";
      }
      const params = new URLSearchParams(window.location.search);
      if (params.get("app") !== appVersion) {
        params.set("app", appVersion);
        params.set("fresh", Date.now().toString());
        window.location.replace(`${window.location.pathname}?${params.toString()}${window.location.hash}`);
      }
    })();
  </script>
  <style>
    :root {
      --bg: #f2f2f2;
      --panel: #ffffff;
      --ink: #050505;
      --text: #111111;
      --muted: #6f6f6f;
      --line: #d9d9d9;
      --line-strong: #111111;
      --soft: #ededed;
      --accent: #d9ff00;
      --cyan: #00e0ff;
      --pink: #ff4f9a;
      --orange: #ff6b00;
      --green: #34d399;
      --day: 92px;
      --sidebar: 228px;
      --head: 78px;
      --row: 44px;
      font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, .045) 1px, transparent 1px) 0 0 / 32px 32px,
        linear-gradient(rgba(0, 0, 0, .04) 1px, transparent 1px) 0 0 / 32px 32px,
        var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      min-width: 0;
      min-height: 0;
    }

    .topbar {
      min-height: 64px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 3px solid var(--ink);
      background: rgba(242, 242, 242, .96);
      box-shadow: 0 6px 0 rgba(0, 0, 0, .08);
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      background: var(--ink);
      color: #f2f2f2;
      font-family: "Arial Black", Impact, sans-serif;
      font-size: 15px;
      letter-spacing: -.04em;
    }

    .brand-copy {
      display: grid;
      gap: 1px;
      line-height: 1;
    }

    .brand-title {
      font-family: Impact, "Arial Black", sans-serif;
      font-size: 24px;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .brand-subtitle {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
      white-space: nowrap;
    }

    .tab {
      height: 34px;
      display: inline-flex;
      align-items: center;
      padding: 0 14px;
      border: 2px solid var(--ink);
      background: var(--accent);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .spacer { flex: 1; }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .icon-btn,
    .text-btn,
    .select {
      height: 34px;
      border: 2px solid var(--ink);
      background: var(--panel);
      box-shadow: 3px 3px 0 var(--ink);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .icon-btn {
      width: 34px;
      display: grid;
      place-items: center;
      padding: 0;
      line-height: 1;
    }

    .text-btn {
      padding: 0 12px;
      white-space: nowrap;
    }

    .text-btn.primary {
      background: var(--ink);
      color: #fff;
      box-shadow: 3px 3px 0 var(--accent);
    }

    .text-btn.warn {
      background: #fff1f1;
      color: #8c1111;
    }

    .text-btn.is-active {
      background: var(--accent);
      color: var(--ink);
    }

    .select {
      width: 150px;
      padding: 0 9px;
    }

    .zoom-label {
      min-width: 44px;
      text-align: center;
      font-family: Consolas, monospace;
      font-size: 12px;
      font-weight: 800;
    }

    .sync-status {
      min-width: 86px;
      padding: 7px 9px;
      border: 2px solid var(--ink);
      background: #fff;
      box-shadow: 3px 3px 0 var(--accent);
      font-size: 11px;
      font-weight: 900;
      line-height: 1;
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .sync-status.is-error {
      background: #fff1f1;
      color: #8c1111;
      box-shadow: 3px 3px 0 #ff4f9a;
    }

    .board {
      min-height: 0;
      display: grid;
      grid-template-columns: var(--sidebar) 1fr;
      overflow: auto;
      position: relative;
    }

    .app.is-booting .board {
      visibility: hidden;
    }

    .boot-screen {
      position: fixed;
      inset: 70px 0 0 0;
      display: grid;
      place-items: center;
      background: var(--paper);
      z-index: 60;
    }

    .boot-card {
      width: min(460px, calc(100vw - 40px));
      padding: 22px;
      border: 3px solid var(--ink);
      background: var(--accent);
      box-shadow: 8px 8px 0 var(--ink);
      font-weight: 900;
      text-transform: uppercase;
    }

    .boot-card span {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .scroll-hints {
      position: fixed;
      inset: 0;
      z-index: 80;
      pointer-events: none;
    }

    .scroll-hint {
      position: fixed;
      left: var(--scroll-hint-left, 14px);
      top: var(--scroll-hint-top, auto);
      bottom: auto;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(0, 0, 0, .15);
      border-radius: 50%;
      background: #fff;
      color: var(--ink);
      box-shadow: 0 3px 12px rgba(0, 0, 0, .18);
      font-family: Impact, var(--font);
      font-size: 20px;
      line-height: 1;
      z-index: 80;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity .15s ease, transform .15s ease, background .15s ease;
    }

    .scroll-hint.is-visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .scroll-hint:hover {
      background: var(--accent);
    }

    .current-month-indicator {
      position: fixed;
      left: var(--current-month-left, 240px);
      top: var(--current-month-top, 82px);
      z-index: 70;
      min-width: 142px;
      padding: 5px 12px 4px;
      border: 2px solid var(--ink);
      background: var(--ink);
      color: #fff;
      font-family: Impact, "Arial Black", sans-serif;
      font-size: 16px;
      line-height: 1;
      text-transform: uppercase;
      box-shadow: 4px 4px 0 var(--accent);
      pointer-events: none;
    }

    .sidebar {
      position: sticky;
      left: 0;
      z-index: 25;
      background: var(--panel);
      border-right: 3px solid var(--ink);
      box-shadow: 8px 0 0 rgba(0, 0, 0, .06);
    }

    .corner {
      position: sticky;
      top: 0;
      height: var(--head);
      display: grid;
      align-content: center;
      gap: 4px;
      padding: 12px 14px;
      border-bottom: 3px solid var(--ink);
      background: var(--panel);
      z-index: 30;
    }

    .corner strong {
      font-family: Impact, "Arial Black", sans-serif;
      font-size: 26px;
      text-transform: uppercase;
      line-height: .9;
    }

    .corner span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .member-row {
      height: var(--row);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      font-weight: 900;
      text-transform: uppercase;
    }

    .avatar {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 2px solid var(--ink);
      background: var(--accent);
      font-size: 11px;
      box-shadow: 2px 2px 0 var(--ink);
      flex: 0 0 auto;
    }

    .timeline-wrap {
      min-width: 0;
      overflow: visible;
      background: rgba(255, 255, 255, .45);
    }

    .timeline {
      position: relative;
      min-width: max-content;
      min-height: 100%;
    }

    .months {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      height: var(--head);
      background: var(--panel);
      border-bottom: 3px solid var(--ink);
    }

    .month {
      border-right: 3px solid var(--ink);
    }

    .month-name {
      height: 34px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      border-bottom: 1px solid var(--line);
      background: var(--ink);
      color: #fff;
      font-family: Impact, "Arial Black", sans-serif;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .days {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: var(--day);
      height: 41px;
    }

    .day {
      display: grid;
      place-items: center;
      gap: 1px;
      border-right: 1px solid var(--line);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .day.weekend {
      background: #e8e8e8;
    }

    .day.today {
      background: var(--accent);
      color: var(--ink);
    }

    .day-number {
      font-size: 14px;
      line-height: 1;
    }

    .grid,
    .weekends,
    .bars {
      position: absolute;
      inset: var(--head) 0 0;
    }

    .grid {
      z-index: 1;
      background:
        repeating-linear-gradient(to right, transparent 0, transparent calc(var(--day) - 1px), rgba(0, 0, 0, .12) calc(var(--day) - 1px), rgba(0, 0, 0, .12) var(--day));
      pointer-events: none;
    }

    .project-band {
      position: absolute;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, .025);
      border-bottom: 2px solid rgba(0, 0, 0, .2);
    }

    .project-band:nth-child(odd) {
      background: rgba(255, 255, 255, .22);
    }

    .project-band.is-ooo {
      background: rgba(217, 255, 0, .08);
      border-bottom-color: rgba(0, 0, 0, .32);
    }

    .weekends {
      z-index: 2;
      pointer-events: none;
    }

    .weekend-band {
      position: absolute;
      top: 0;
      bottom: 0;
      background: rgba(0, 0, 0, .05);
      border-left: 1px solid rgba(0, 0, 0, .08);
      border-right: 1px solid rgba(0, 0, 0, .08);
    }

    .today-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--pink);
      z-index: 3;
      pointer-events: none;
    }

    .bars {
      z-index: 5;
    }

    .bar {
      position: absolute;
      height: 26px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      border: 2px solid var(--ink);
      background: var(--panel);
      box-shadow: 4px 4px 0 var(--ink);
      color: var(--text);
      overflow: hidden;
      user-select: none;
      touch-action: none;
      cursor: grab;
    }

    .bar.is-ooo {
      cursor: default;
      box-shadow: 3px 3px 0 var(--ink);
    }

    .bar.is-subtask {
      height: 28px;
      padding: 0 8px;
      border-style: dashed;
      background: repeating-linear-gradient(135deg, #fff 0, #fff 6px, rgba(0, 0, 0, .06) 6px, rgba(0, 0, 0, .06) 12px);
      box-shadow: 2px 2px 0 var(--ink);
      cursor: default;
    }

    .bar.is-subtask .bar-title::before {
      content: "SUB ";
      color: var(--muted);
      font-size: 10px;
    }

    .bar-parent {
      max-width: 130px;
      overflow: hidden;
      color: var(--muted);
      font-size: 9px;
      font-weight: 900;
      line-height: 1;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .bar.is-done {
      background: #e7ffe7;
    }

    .bar.is-done::after {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      top: 50%;
      height: 3px;
      background: currentColor;
      transform: rotate(-1deg);
      z-index: 8;
      pointer-events: none;
    }

    .bar.is-done .bar-title,
    .bar.is-done .bar-member,
    .bar.is-done .bar-label,
    .bar.is-done .bar-status-select {
      text-decoration: line-through;
      text-decoration-thickness: 2px;
    }

    .bar.is-dragging {
      opacity: .76;
      cursor: grabbing;
      z-index: 40;
    }

    .bar-status {
      width: 10px;
      height: 10px;
      border: 1px solid var(--ink);
      flex: 0 0 auto;
    }

    .bar-status-dot {
      width: 13px;
      height: 13px;
      border: 2px solid var(--ink);
      flex: 0 0 auto;
      display: none;
    }

    .bar-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .bar-meta {
      flex: 0 0 auto;
      margin-left: auto;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .bar-subtasks,
    .bar-label,
    .bar-member {
      flex: 0 0 auto;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--ink);
      background: #fff;
      color: var(--ink);
      font-size: 10px;
      font-weight: 900;
      line-height: 1;
      text-transform: uppercase;
    }

    .bar-subtasks {
      min-width: 30px;
      padding: 0 5px;
    }

    .bar-label {
      max-width: 150px;
      padding: 0 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .bar-status-select {
      flex: 0 0 auto;
      max-width: 156px;
      height: 20px;
      padding: 0 22px 0 6px;
      border: 1px solid var(--ink);
      border-radius: 0;
      color: var(--status-text, #111111);
      background: var(--status-bg, #fff);
      font: inherit;
      font-size: 10px;
      font-weight: 900;
      line-height: 1;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: none;
      appearance: none;
      -webkit-appearance: none;
    }

    .bar-status-select:focus {
      outline: 2px solid var(--pink);
      outline-offset: 1px;
    }

    .bar-member {
      max-width: 74px;
      padding: 0 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .bar-unassigned {
      max-width: 140px;
      background: #fff1f1;
      color: #8c1111;
    }

    .is-compact-overview .bar {
      height: 136px;
      align-items: flex-start;
      align-content: flex-start;
      flex-wrap: wrap;
      gap: 4px;
      padding: 5px 8px;
      border-width: 2px;
      box-shadow: 2px 2px 0 var(--ink);
    }

    .is-compact-overview .bar-title {
      font-size: 11px;
      line-height: 1.12;
      flex: 1 0 100%;
      min-width: 0;
      max-width: 100%;
      overflow: visible;
      text-overflow: clip;
      white-space: normal;
    }

    .is-compact-overview .bar-subtasks,
    .is-compact-overview .bar-label,
    .is-compact-overview .bar-delete {
      display: none;
    }

    .is-compact-overview .bar-status-select {
      width: 70px;
      max-width: 70px;
      height: 18px;
      padding: 0 4px;
      font-size: 9px;
      text-align: center;
      flex: 0 0 70px;
    }

    .is-compact-overview .bar-status-dot {
      display: none;
    }

    .is-compact-overview .bar-member {
      max-width: 56px;
      height: 16px;
      padding: 0 4px;
      font-size: 9px;
    }

    .is-compact-overview .bar-unassigned {
      max-width: 96px;
      flex: 0 0 96px;
    }

    .is-ultra-overview .bar {
      height: 156px;
      align-items: flex-start;
      align-content: flex-start;
      flex-wrap: wrap;
      gap: 4px;
      padding: 5px 6px;
      box-shadow: 1px 1px 0 var(--ink);
    }

    .is-ultra-overview .bar-title {
      font-size: 10px;
      line-height: 1.1;
      flex: 1 0 100%;
      min-width: 0;
      overflow: visible;
      text-overflow: clip;
      white-space: normal;
    }

    .is-ultra-overview .bar-member {
      max-width: 42px;
      height: 14px;
      padding: 0 3px;
      font-size: 8px;
    }

    .is-ultra-overview .bar-status-dot {
      display: none;
    }

    .is-ultra-overview .bar-status-select {
      width: 62px;
      max-width: 62px;
      height: 16px;
      padding: 0 3px;
      font-size: 8px;
      text-align: center;
      flex-basis: 62px;
    }

    .task-tooltip {
      position: fixed;
      left: 0;
      top: 0;
      max-width: 320px;
      padding: 9px 10px;
      border: 2px solid var(--ink);
      background: #fff;
      box-shadow: 4px 4px 0 var(--ink);
      color: var(--text);
      font-size: 12px;
      font-weight: 900;
      line-height: 1.35;
      text-transform: uppercase;
      white-space: pre-line;
      pointer-events: none;
      opacity: 0;
      transform: translate(-9999px, -9999px);
      z-index: 1000;
    }

    .task-tooltip.open {
      opacity: 1;
    }

    .bar-delete {
      flex: 0 0 auto;
      width: 20px;
      height: 20px;

      top: 18px;

      background: var(--panel);

      align-items: center;
      justify-content: space-between;

      color: #fff;

      text-transform: uppercase;

      display: grid;
      gap: 14px;
      padding: 14px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .field.full { grid-column: 1 / -1; }

    label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;

    select,
    textarea {

      padding: 9px 10px;
      font-size: 14px;

      color: var(--text);

      height: 18px;
      padding: 0;

      min-height: 42px;

    .modal-actions {

      justify-content: flex-end;
      gap: 8px;

    .settings-list {
      display: grid;

    }

    .settings-row {
      display: grid;

      align-items: center;

    .history-list {
      display: grid;
      gap: 8px;

      height: 22px;
      padding: 0;

      align-items: center;
      gap: 6px;
      border: 2px solid var(--ink);
      background: #fff;
      padding: 7px 8px;
      color: var(--text);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;

      width: 16px;
      height: 16px;
      padding: 0;
      accent-color: var(--accent);
    }

    }

    .context-menu {
      position: fixed;
      z-index: 200;
      min-width: 210px;
      display: none;
      gap: 4px;
      padding: 6px;
      border: 3px solid var(--ink);
      background: var(--panel);

    }

    .context-menu button {
      min-height: 34px;

      align-items: center;

      gap: 12px;
      border: 0;
      background: transparent;
      padding: 0 9px;
      font-size: 12px;
      font-weight: 900;

    .settings-title {

    .settings-title h3 {

      }

</head>
